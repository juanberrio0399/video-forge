<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-label="How video-forge works: Telegram talks to a Cloudflare Worker that keeps its state in R2 and starts the cycle; every two hours the cycle decides, produces, checks licenses, uploads to YouTube and measures, and the measurements go back to R2">
