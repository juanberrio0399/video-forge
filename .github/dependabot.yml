version: 2
# Dependabot: alertas y PRs automáticos cuando una dependencia tiene versión nueva o
# vulnerabilidad conocida. Gratis en repos públicos. Revisar cada PR antes de mergear.
updates:
  - package-ecosystem: "npm"
    directory: "/bot"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    assignees:
      - "juanberrio0399"
    labels:
      - "mantenimiento-automatico"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    assignees:
      - "juanberrio0399"
    labels:
      - "mantenimiento-automatico"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    assignees:
      - "juanberrio0399"
    labels:
      - "mantenimiento-automatico"
  - package-ecosystem: "pip"
    directory: "/clipper"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    assignees:
      - "juanberrio0399"
    labels:
      - "mantenimiento-automatico"
