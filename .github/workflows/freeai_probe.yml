name: Free.ai sonda (descubrir contrato de la API de video)

# Sonda el contrato de la API de video de Free.ai (endpoints, formatos, límites) para decidir si
# entra como motor. No produce nada; solo reporta lo que responde. Solo manual.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FREEAI_API_KEY: ${{ secrets.FREEAI_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Sondear la API de Free.ai
        run: node pipeline/freeai_probe.mjs
