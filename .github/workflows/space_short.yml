name: Short de ESPACIO (Space Facts — Oddly, video NASA)

# Short 9:16 calmado de espacio ("space facts to fall asleep to" como vibe) para Oddly Loop:
# footage de VIDEO REAL de la NASA (dominio público), voz suave + lecho ambiental generado + subtítulos.
# Sube PRIVADO a Oddly (YT2_) para que Juan lo revise y publique desde la app. De momento disparo manual.

on:
  schedule:
    - cron: "0 16 * * *"   # 1/día (~11am Bogotá): produce un short de espacio PRIVADO en Oddly para revisar/publicar
  workflow_dispatch:
    inputs:
      topic:
        description: "Tema exacto (opcional, para pruebas)"
        required: false
        default: ""
      voice:
        description: "Voz Kokoro (af_heart=cálida, af_nicole=suave, bm_george=británica calma, am_michael)"
        required: false
        default: "af_heart"

permissions:
  contents: read

env:
  BUCKET: video-forge

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "true"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      # Oddly Loop = YT2_* mapeado a YT_* (los uploaders leen YT_*).
      YT_CLIENT_ID: ${{ secrets.YT2_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT2_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT2_REFRESH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
      TOPIC: ${{ github.event.inputs.topic }}
      KVOICE: ${{ github.event.inputs.voice || 'af_heart' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: FFmpeg + fuentes
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core

      - name: Temas ya usados (no repetir)
        run: npx --yes wrangler@4 r2 object get "$BUCKET/channel/space_short_used.json" --file=space_short_used.json --remote 2>/dev/null || echo '[]' > space_short_used.json

      - name: Estrategia del Cerebro 2.0 (para que el guion actúe con lo aprendido)
        run: npx --yes wrangler@4 r2 object get "$BUCKET/channel/brain/strategy.json" --file=strategy.json --remote 2>/dev/null || echo '{}' > strategy.json

      - name: Guion calmado del short
        run: node pipeline/space_short_script.mjs script.json narration.txt

      - name: Voz calmada (Kokoro — open source, SIN cuota)
        run: |
          pip install --quiet kokoro-onnx soundfile numpy
          curl -fL --retry 3 -o kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -fL --retry 3 -o voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          python pipeline/tts_kokoro_simple.py narration.txt narration.mp3 0.9
          echo "duración: $(ffprobe -v error -show_entries format=duration -of default=nk=1:nw=1 narration.mp3)s"

      - name: Subtítulos por palabra (Whisper)
        run: |
          pip install faster-whisper
          python pipeline/whisper_words.py narration.mp3 words.json || echo "sin karaoke (uso frases)"

      - name: Ensamblar el short (VIDEO NASA/stock + ambiente + subtítulos)
        run: node pipeline/space_short.mjs script.json narration.mp3 short.mp4

      - name: Frames de muestra (para validar calidad)
        if: ${{ hashFiles('short.mp4') != '' }}
        run: |
          mkdir -p frames
          for t in 3 8 14 20 26 32 38 44; do ffmpeg -y -ss $t -i short.mp4 -frames:v 1 -q:v 3 "frames/f_${t}s.jpg" 2>/dev/null || true; done
          ls -la frames || true
      - name: Subir frames como artefacto
        if: ${{ hashFiles('frames/*.jpg') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: frames
          path: frames/
          retention-days: 3

      - name: Subir a YouTube (PRIVADO, Oddly Loop)
        run: node pipeline/youtube_upload.mjs short.mp4 publish/package.json

      - name: Miniatura (frame del video + gancho) y setearla
        if: ${{ hashFiles('publish/video_id.txt') != '' }}
        run: |
          node pipeline/make_thumbnail.mjs short.mp4 script.json thumbnail.jpg || echo "miniatura: no generada"
          node pipeline/set_thumbnail.mjs "$(cat publish/video_id.txt)" thumbnail.jpg || echo "miniatura: no seteada"
      - name: Subir miniatura como artefacto (para revisar)
        if: ${{ hashFiles('thumbnail.jpg') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: thumbnail
          path: thumbnail.jpg
          retention-days: 3

      - name: Cerebro 2.0 — registrar los "genes" del video (aprendizaje)
        if: ${{ hashFiles('publish/video_id.txt') != '' }}
        run: |
          npx --yes wrangler@4 r2 object get "$BUCKET/channel/brain/learning.json" --file=learning.json --remote 2>/dev/null || echo '[]' > learning.json
          node -e '
            const fs=require("fs");let L=[];try{L=JSON.parse(fs.readFileSync("learning.json","utf8"))}catch(e){}if(!Array.isArray(L))L=[];
            let s={};try{s=JSON.parse(fs.readFileSync("script.json","utf8"))}catch(e){}
            const id=fs.readFileSync("publish/video_id.txt","utf8").trim();
            if(id && !L.find(x=>x.video_id===id)) L.push({video_id:id, channel:"oddly", niche:"space", format:"short", subject:(s.topic||""), hook:(s.hook||""), thumb_text:(s.thumb_text||""), voice:(process.env.KVOICE||"af_heart"), footage:"stock", published_at:new Date().toISOString(), source:"space_short"});
            fs.writeFileSync("learning_new.json",JSON.stringify(L.slice(-1000)));
          '
          npx --yes wrangler@4 r2 object put "$BUCKET/channel/brain/learning.json" --file=learning_new.json --remote --content-type application/json

      - name: Registrar tema usado + refrescar app
        if: ${{ hashFiles('publish/video_id.txt') != '' }}
        run: |
          node -e '
            const fs=require("fs");let u=[];try{u=JSON.parse(fs.readFileSync("space_short_used.json","utf8"))}catch(e){}if(!Array.isArray(u))u=[];
            let t="";try{t=fs.readFileSync("chosen_topic.txt","utf8").trim()}catch(e){}
            if(t&&!u.includes(t))u.push(t);
            fs.writeFileSync("space_short_used_new.json",JSON.stringify(u.slice(-300)));
          '
          npx --yes wrangler@4 r2 object put "$BUCKET/channel/space_short_used.json" --file=space_short_used_new.json --remote --content-type application/json
          npx --yes wrangler@4 r2 object delete "$BUCKET/channel/auto2/inventory_cache.json" --remote 2>/dev/null || true

      - name: Avisar listo (revisar y publicar en la app)
        if: always()
        run: |
          if [ -f publish/video_id.txt ]; then
            VID=$(cat publish/video_id.txt)
            TITLE=$(node -e 'try{process.stdout.write(require("./publish/package.json").title)}catch(e){process.stdout.write("Space Facts to Fall Asleep To")}')
            bash pipeline/notify_telegram.sh "🌌 Short de ESPACIO listo (privado, Oddly): ${TITLE}"$'\n'"▶️ https://youtu.be/${VID}"$'\n\n'"👉 Revísalo y publícalo desde la app (Oddly)."
          else
            bash pipeline/notify_telegram.sh "❌ El short de espacio (Oddly) falló al generar/subir. Revisa el log de Actions."
          fi
