name: Render VIDEO (voz + subtitulos)

# Arma el video del canal: baja la voz + el mapa de tiempos de R2, genera la
# composicion sincronizada (contador + subtitulos + numeros hero), renderiza el
# MP4 y lo manda al chat con botones de aprobacion.

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: "Duracion a renderizar (0 = completo; 45 = prueba corta)"
        required: false
        default: "45"

permissions:
  contents: read

env:
  BUCKET: video-forge
  PROJECT: "0001-youtube-money"
  HF_VERSION: "0.7.68"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: "true"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      SECONDS_ARG: ${{ github.event.inputs.seconds || '45' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install FFmpeg + Chrome libs
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libpango-1.0-0 libcairo2 fonts-liberation \
            libasound2t64 || sudo apt-get install -y libasound2

      - name: Bajar voz + tiempos de R2
        run: |
          npx --yes wrangler@4 r2 object get "$BUCKET/audio/$PROJECT/voiceover.mp3" --file=voiceover.mp3 --remote
          npx --yes wrangler@4 r2 object get "$BUCKET/audio/$PROJECT/timing.json" --file=timing.json --remote
          ls -la voiceover.mp3 timing.json

      - name: Armar fondo tipo pelicula (footage + IA animada)
        run: |
          node pipeline/build_background.mjs timing.json bg "$SECONDS_ARG" || echo "fondo opcional fallo; sigo"
          ls -la bg/*.mp4 2>/dev/null || true

      - name: Generar composicion (index.html)
        run: |
          node pipeline/build_composition.mjs timing.json index.html voiceover.mp3 "$SECONDS_ARG" bg/bg.json
          head -c 500 index.html

      - name: Renderizar MP4
        run: |
          npx --yes hyperframes@${HF_VERSION} render --quality standard --workers auto -o renders/video.mp4
          ls -la renders/

      - name: Guardar video en R2
        if: ${{ hashFiles('renders/video.mp4') != '' }}
        run: |
          npx --yes wrangler@4 r2 object put "$BUCKET/video/$PROJECT/video.mp4" --file=renders/video.mp4 --remote
          echo "R2: video/$PROJECT/video.mp4"

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: renders/video.mp4
          if-no-files-found: error
          retention-days: 14

      - name: Enviar al chat con botones de aprobacion
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
        run: |
          if [ -f renders/video.mp4 ]; then
            MK='{"inline_keyboard":[[{"text":"✅ Aprobar","callback_data":"approve:video"},{"text":"🔁 Regenerar","callback_data":"regen:video"}],[{"text":"✏️ Cambiar algo","callback_data":"change:video"}]]}'
            bash pipeline/notify_telegram.sh "🎬 Video listo. Revisalo y aprueba (o pide cambios)." renders/video.mp4 "$MK"
          else
            bash pipeline/notify_telegram.sh "❌ El render del video fallo."
          fi
