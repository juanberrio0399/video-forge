name: Render VIDEO (voz + subtitulos)

# Arma el video del canal: baja la voz + el mapa de tiempos de R2, genera la
# composicion sincronizada (contador + subtitulos + numeros hero), renderiza el
# MP4 y lo manda al chat con botones de aprobacion.

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: "Duracion a renderizar (0 = completo; 45 = prueba corta)"
        required: false
        default: "45"

permissions:
  contents: read

env:
  BUCKET: video-forge
  PROJECT: "0001-youtube-money"
  HF_VERSION: "0.7.68"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: "true"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SECONDS_ARG: ${{ github.event.inputs.seconds || '45' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install FFmpeg + Chrome libs
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libpango-1.0-0 libcairo2 fonts-liberation \
            libasound2t64 || sudo apt-get install -y libasound2

      - name: Bajar voz + tiempos de R2
        run: |
          npx --yes wrangler@4 r2 object get "$BUCKET/audio/$PROJECT/voiceover.mp3" --file=voiceover.mp3 --remote
          npx --yes wrangler@4 r2 object get "$BUCKET/audio/$PROJECT/timing.json" --file=timing.json --remote
          ls -la voiceover.mp3 timing.json

      - name: Render con puerta de calidad (auto-mejora: umbral 7.5, hasta 3 intentos)
        env:
          THRESHOLD: "7.5"
          MAX_ATTEMPTS: "3"
        run: |
          set -e
          mkdir -p renders
          export FX_BRIGHT=0 FX_SAT=0 FX_CONTRAST=0 FX_PACE=same
          BEST="-1"; BESTATT=0
          for att in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "===== Intento $att/$MAX_ATTEMPTS (FX b=$FX_BRIGHT s=$FX_SAT c=$FX_CONTRAST pace=$FX_PACE) ====="
            node pipeline/build_background.mjs timing.json bg "$SECONDS_ARG" || echo "fondo opcional fallo; sigo"
            node pipeline/build_composition.mjs timing.json index.html voiceover.mp3 "$SECONDS_ARG" bg/bg.json
            npx --yes hyperframes@${HF_VERSION} render --quality standard --workers auto -o "renders/try_${att}.mp4"
            node pipeline/review_video.mjs "renders/try_${att}.mp4" "How much money does YouTube make every second" "review_${att}.txt" "review_${att}.json" || echo "review fallo"
            SCORE=$(node -e "try{console.log(JSON.parse(require('fs').readFileSync('review_${att}.json','utf8')).score||0)}catch(e){console.log(0)}")
            echo "Nota intento $att: $SCORE"
            if node -e "process.exit((${SCORE}||0) > (${BEST}) ? 0 : 1)"; then
              BEST="$SCORE"; BESTATT="$att"
              cp "renders/try_${att}.mp4" renders/video.mp4
              cp "review_${att}.txt" review.txt 2>/dev/null || true
            fi
            if node -e "process.exit((${SCORE}||0) >= ${THRESHOLD} ? 0 : 1)"; then
              echo "Paso el umbral ($SCORE >= $THRESHOLD) en el intento $att."
              break
            fi
            if [ "$att" -lt "$MAX_ATTEMPTS" ]; then
              eval "$(node -e "try{const f=JSON.parse(require('fs').readFileSync('review_${att}.json','utf8')).fixes||{};const cl=(x,a,b)=>Math.max(a,Math.min(b,x));const b=cl((+process.env.FX_BRIGHT||0)+(+f.brightness||0),-0.08,0.12).toFixed(3);const s=cl((+process.env.FX_SAT||0)+(+f.saturation||0),-0.1,0.2).toFixed(3);const c=cl((+process.env.FX_CONTRAST||0)+(+f.contrast||0),-0.05,0.2).toFixed(3);const p=(f.pace==='faster'||process.env.FX_PACE==='faster')?'faster':'same';console.log('export FX_BRIGHT='+b+' FX_SAT='+s+' FX_CONTRAST='+c+' FX_PACE='+p)}catch(e){console.log('export FX_BRIGHT=0 FX_SAT=0 FX_CONTRAST=0 FX_PACE=same')}")"
              echo "Ajustes aplicados para el proximo intento."
            fi
          done
          echo "BEST_SCORE=$BEST" >> "$GITHUB_ENV"
          echo "BEST_ATTEMPT=$BESTATT" >> "$GITHUB_ENV"
          echo "===== Mejor: intento $BESTATT con nota $BEST ====="
          ls -la renders/video.mp4

      - name: Guardar video en R2
        if: ${{ hashFiles('renders/video.mp4') != '' }}
        run: |
          npx --yes wrangler@4 r2 object put "$BUCKET/video/$PROJECT/video.mp4" --file=renders/video.mp4 --remote
          echo "R2: video/$PROJECT/video.mp4"

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: renders/video.mp4
          if-no-files-found: error
          retention-days: 14

      - name: Enviar al chat con botones de aprobacion
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
        run: |
          if [ -f renders/video.mp4 ]; then
            MK='{"inline_keyboard":[[{"text":"✅ Aprobar","callback_data":"approve:video"},{"text":"🔁 Regenerar","callback_data":"regen:video"}],[{"text":"✏️ Cambiar algo","callback_data":"change:video"}]]}'
            MSG="🎬 Video listo — mejor de ${BEST_ATTEMPT:-1} intento(s), nota ${BEST_SCORE:-?}/10."
            if node -e "process.exit((${BEST_SCORE:-0}) >= 7.5 ? 0 : 1)"; then MSG="$MSG ✅ Paso el umbral (7.5)."; else MSG="$MSG ⚠️ No llego a 7.5; te mando la mejor version lograda."; fi
            MSG="$MSG Revisalo y aprueba (o pide cambios)."
            bash pipeline/notify_telegram.sh "$MSG" renders/video.mp4 "$MK"
            if [ -f review.txt ]; then bash pipeline/notify_telegram.sh "$(cat review.txt)"; fi
          else
            bash pipeline/notify_telegram.sh "❌ El render del video fallo."
          fi
