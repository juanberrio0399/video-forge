name: Ejemplos de voz (para el selector)

# Genera un clip corto de cada voz disponible y lo guarda en R2 (voices/sample_*.mp3)
# para que el bot te deje ESCUCHAR y elegir. Se corre una vez (o cuando agreguemos voces).

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUCKET: video-forge

jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: ffmpeg + espeak + kokoro
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
          pip install --quiet kokoro-onnx soundfile numpy
          curl -sL -o kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -sL -o voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin

      - name: Generar ejemplos (Gemini + Kokoro)
        run: |
          echo "This is The Data Lens. Here is how much money that really makes." > sample.txt
          # Gemini locutor Charon
          node pipeline/gemini_tts.mjs sample.txt s_gemini_charon.mp3 Charon || echo "gemini charon fallo"
          # Kokoro voces
          for V in am_michael am_adam bm_george bm_lewis af_heart af_bella bf_emma; do
            python pipeline/kokoro_sample.py "$V" "s_$V.wav" && ffmpeg -y -i "s_$V.wav" -codec:a libmp3lame -q:a 4 "s_kokoro_$V.mp3" || echo "kokoro $V fallo"
          done
          ls -la s_*.mp3

      - name: Subir ejemplos a R2
        run: |
          for f in s_*.mp3; do
            name="${f#s_}"
            npx --yes wrangler@4 r2 object put "$BUCKET/voices/sample_${name}" --file="$f" --remote --content-type audio/mpeg || echo "no subi $f"
          done
          echo "ejemplos en R2: voices/sample_*.mp3"

      - name: Avisar
        if: always()
        run: bash pipeline/notify_telegram.sh "🎙️ Ejemplos de voz listos. Ábrelos en la app → Crear → 'Voz del canal' para escucharlos y elegir."
