name: Chequeo de IAs gratis (proveedores LLM)

# Prueba qué proveedores de IA gratis están activos (tienen key y responden). Úsalo tras agregar una key.
# WATCHDOG: además corre solo cada día y AVISA a Telegram únicamente si la cadena queda degradada
# (menos de 2 proveedores activos), para enterarte antes de que algo falle. El disparo manual siempre reporta.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 12 * * *"   # 1/día, 7am Bogotá

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
      LLM_DIAG: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Probar proveedores
        run: node pipeline/llm_health.mjs | tee health.txt
      - name: Avisar a Telegram
        if: always()
        run: |
          ACTIVE=$(cat active_count.txt 2>/dev/null || echo 0)
          # Manual -> siempre reporta. Cron (watchdog) -> solo si quedan < 2 proveedores (degradado).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            bash pipeline/notify_telegram.sh "🤖 IAs gratis activas:"$'\n'"$(cat health.txt)"
          elif [ "$ACTIVE" -lt 2 ]; then
            bash pipeline/notify_telegram.sh "⚠️ WATCHDOG: la cadena de IA está DEGRADADA ($ACTIVE activo)."$'\n'"$(cat health.txt)"$'\n'"Revisa las keys en Actions ▸ Chequeo de IAs."
          else
            echo "Watchdog OK: $ACTIVE proveedores activos, sin aviso."
          fi
