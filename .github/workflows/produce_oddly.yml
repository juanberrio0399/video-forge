name: Producir compilacion (Oddly Loop / canal auto)

# Loop del 2do canal (Oddly Loop): guion de compilacion -> voz Kokoro -> ensamblar clips
# LEGALES (Pexels/Pixabay) + narracion + musica + ranking -> PUERTA de compliance -> subir a
# Oddly Loop (YT2) -> programar a la mejor hora (o dejar privado para revisar) -> niche_map.
# Reusa youtube_upload / youtube_schedule mapeando YT2_* -> YT_*.

on:
  workflow_dispatch:
    inputs:
      niche:
        description: "Nicho (satisfying / narrativas / ciencia_humor / naturaleza_relax)"
        default: "satisfying"
      variant:
        description: "puro = ASMR sin voz (solo sonido+visual) · narrado = con narración suave"
        default: "puro"
      kind:
        description: "video = compilación larga · short = Short vertical <=45s (lo que más se descubre)"
        default: "video"
      format:
        description: "16:9 o 9:16 (short fuerza 9:16)"
        default: "16:9"
      publish:
        description: "no = privado para revisar · yes = programa a la mejor hora"
        default: "no"

permissions:
  contents: read

env:
  BUCKET: video-forge

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}  # efectos ASMR CC0 (opcional; si falta usa el audio del clip)
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # YT2 -> YT: asi youtube_upload/youtube_schedule suben a Oddly Loop sin tocar su codigo.
      YT_CLIENT_ID: ${{ secrets.YT2_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT2_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT2_REFRESH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
      CHANNEL_URL: "https://youtube.com/@oddlyloophq"
      YT_CATEGORY_ID: "24"  # Entertainment (Oddly Loop)
      NICHE: ${{ github.event.inputs.niche || 'satisfying' }}
      VARIANT: ${{ github.event.inputs.variant || 'puro' }}
      KIND: ${{ github.event.inputs.kind || 'video' }}
      FORMAT: ${{ github.event.inputs.format || '16:9' }}
      PUBLISH: ${{ github.event.inputs.publish || 'no' }}
      KVOICE: af_heart
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar ffmpeg + fuentes + Kokoro
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-liberation
          pip install --quiet kokoro-onnx soundfile numpy
          curl -fL --retry 3 -o kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -fL --retry 3 -o voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin

      - name: Formato del Short (fuerza 9:16)
        run: if [ "$KIND" = "short" ]; then echo "FORMAT=9:16" >> "$GITHUB_ENV"; fi

      - name: Aprendizaje del canal (titulos ganadores) -> el guion imita lo que rinde
        run: |
          npx --yes wrangler@4 r2 object get "$BUCKET/channel/auto2/state.json" --file=auto2_state.json --remote 2>/dev/null || echo '{}' > auto2_state.json
          LEARN=$(node -e 'try{const s=JSON.parse(require("fs").readFileSync("auto2_state.json","utf8"));const t=(s.top||[]).slice(0,5).map(v=>`"${(v.title||"").replace(/ #Shorts$/,"").replace(/[\r\n]+/g," ")}" (${v.vpd||0}/dia${v.niche_label?", "+v.niche_label:""})`).join(" · ");process.stdout.write(t)}catch(e){}')
          echo "ODDLY_LEARN=${LEARN}" >> "$GITHUB_ENV"
          [ -n "$LEARN" ] && echo "Aprendizaje: $LEARN" || echo "Sin datos de aprendizaje aun (usa el prompt base)"
      - name: Guion de la compilacion (IA)
        run: |
          if node pipeline/compilation_script.mjs "$NICHE" voicemap.json "$VARIANT" "$KIND"; then
            echo "guion ok"
          else
            bash pipeline/notify_telegram.sh "⏸️ Oddly Loop: pospongo — Gemini sin cuota (429). Reintento en el proximo ciclo." || true
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - name: Voz Kokoro (narracion calmada)
        if: ${{ env.SKIP != '1' && env.VARIANT != 'puro' }}
        run: python pipeline/tts_kokoro.py voicemap.json voice.wav 0 1

      - name: Musica de fondo (calm)
        if: ${{ env.SKIP != '1' }}
        run: npx --yes wrangler@4 r2 object get "$BUCKET/music/cinematic.mp3" --file=music.mp3 --remote 2>/dev/null || echo "sin musica"

      - name: Biblioteca ASMR curada (si existe en R2)
        if: ${{ env.SKIP != '1' }}
        run: |
          if npx --yes wrangler@4 r2 object get "$BUCKET/channel/auto2/asmr_lib.tgz" --file=asmr_lib.tgz --remote 2>/dev/null; then
            mkdir -p asmr_lib && tar xzf asmr_lib.tgz -C asmr_lib && echo "biblioteca ASMR curada lista ($(ls asmr_lib/*.mp3 2>/dev/null | wc -l) sonidos)"
          else echo "sin biblioteca curada -> usare Freesound en vivo o el audio del clip"; fi

      - name: Ensamblar la compilacion (clips LEGALES + narracion + ranking)
        if: ${{ env.SKIP != '1' }}
        run: node pipeline/build_compilation.mjs "$NICHE" voicemap.json voice.wav.timing.json voice.wav compilation.mp4 "$FORMAT"

      - name: PUERTA de compliance (bloquea si algo no esta licenciado)
        if: ${{ env.SKIP != '1' }}
        run: |
          if node pipeline/compliance_check.mjs compilation_manifest.json channel/auto2/sources.seed.json; then
            echo "compliance ok"
          else
            bash pipeline/notify_telegram.sh "🚫 Oddly Loop: NO publico — la puerta de compliance rechazo el material:"$'\n'"$(cat compliance_fail.txt 2>/dev/null)" || true
            exit 1
          fi

      - name: SEO (titulo/descripcion/tags) para Oddly Loop
        if: ${{ env.SKIP != '1' }}
        run: |
          TITLE=$(node -e 'try{process.stdout.write(JSON.parse(require("fs").readFileSync("voicemap.json","utf8")).title||"Oddly Satisfying")}catch(e){process.stdout.write("Oddly Satisfying")}')
          GROWTH_TONE=suave node pipeline/publish_package.mjs voicemap.json voice.wav.timing.json "$TITLE" publish

      - name: Marcar como Short (#Shorts)
        if: ${{ env.SKIP != '1' && env.KIND == 'short' }}
        run: |
          node -e 'const fs=require("fs");const p="publish/package.json";const j=JSON.parse(fs.readFileSync(p,"utf8"));let t=(j.title||"Oddly Satisfying").replace(/#shorts/ig,"").trim();j.title=(t.slice(0,88)+" #Shorts").slice(0,100);j.description="#Shorts #ASMR #satisfying\n\n"+(j.description||"");if(Array.isArray(j.tags))j.tags=["shorts","asmr","satisfying","oddlysatisfying"].concat(j.tags).filter((v,i,a)=>a.indexOf(v)===i).slice(0,30);fs.writeFileSync(p,JSON.stringify(j,null,2));console.log("marcado #Shorts:",j.title)'

      - name: Subir a Oddly Loop (PRIVADO)
        if: ${{ env.SKIP != '1' }}
        run: node pipeline/youtube_upload.mjs compilation.mp4 publish/package.json

      - name: niche_map (para el radar) + programar / avisar
        if: ${{ env.SKIP != '1' }}
        run: |
          if [ ! -f publish/video_id.txt ]; then
            bash pipeline/notify_telegram.sh "❌ Oddly Loop: fallo la subida. Revisa el log." || true
            exit 1
          fi
          VID=$(cat publish/video_id.txt)
          # Mapear video->nicho (para el radar de nichos).
          npx --yes wrangler@4 r2 object get "$BUCKET/channel/auto2/niche_map.json" --file=nm.json --remote 2>/dev/null || echo '{}' > nm.json
          VID="$VID" NICHE="$NICHE" node -e 'const fs=require("fs");let m={};try{m=JSON.parse(fs.readFileSync("nm.json","utf8"))}catch(e){};m[process.env.VID]=process.env.NICHE;fs.writeFileSync("nm.json",JSON.stringify(m))'
          npx --yes wrangler@4 r2 object put "$BUCKET/channel/auto2/niche_map.json" --file=nm.json --remote --content-type application/json || true
          # Publicar: programar a la mejor hora, o dejar privado para revisar.
          PIEZA="compilacion"; [ "$KIND" = "short" ] && PIEZA="Short 📱"
          if [ "$PUBLISH" = "yes" ]; then
            npx --yes wrangler@4 r2 object get "$BUCKET/channel/auto2/best_hours.json" --file=best_hours.json --remote 2>/dev/null || true
            OCC=$(node pipeline/scheduled_times.mjs)
            SLOT=$(node pipeline/best_slot.mjs "$OCC")
            node pipeline/youtube_schedule.mjs "$VID" "$SLOT" || true
            bash pipeline/notify_telegram.sh "🎬 Oddly Loop: ${PIEZA} (${NICHE}/${VARIANT}) subida y PROGRAMADA para la mejor hora ($SLOT). $(cat publish/youtube_result.txt 2>/dev/null | head -2)"
          else
            bash pipeline/notify_telegram.sh "🎬 Oddly Loop: ${PIEZA} (${NICHE}/${VARIANT}) subida como PRIVADO para que la revises 👀:"$'\n'"$(cat publish/youtube_result.txt 2>/dev/null | head -2)"$'\n\n'"Si te gusta, la siguiente corrida con publish=yes ya la programa sola."
          fi
