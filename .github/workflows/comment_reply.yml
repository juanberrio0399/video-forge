name: Auto-responder comentarios (natural, Gemini)

# Responde comentarios NUEVOS de ambos canales, corto y humano, con la cadena de IA gratis.
# Tope 8/corrida por canal (no spamear). Anti-duplicado en R2.
on:
  schedule:
    - cron: "23 */6 * * *"   # cada 6 horas
  workflow_dispatch: {}

permissions:
  contents: read

env:
  BUCKET: video-forge

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: The Data Lens (YT_)
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: node pipeline/comment_reply.mjs data-lens || true
      - name: Oddly Loop (YT2_)
        env:
          YT_CLIENT_ID: ${{ secrets.YT2_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT2_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT2_REFRESH_TOKEN }}
        run: node pipeline/comment_reply.mjs oddly || true
