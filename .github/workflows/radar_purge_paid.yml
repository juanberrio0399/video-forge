name: Radar — limpiar issues DE PAGO (one-shot)

# Revisa TODOS los issues `radar` abiertos (11 repos) con la IA gratis y CIERRA los que dependan de
# algo de pago (el radar ahora es solo-gratis). dry_run=1 solo simula (no cierra nada) para revisar.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = simular (no cierra, solo lista). 0 = cerrar de verdad."
        required: false
        default: "1"

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      DRY_RUN: ${{ inputs.dry_run }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Clasificar y limpiar
        run: node pipeline/radar_purge_paid.mjs | tee purge.txt
      - name: Avisar a Telegram
        if: always()
        run: |
          if [ -f purge_report.txt ]; then bash pipeline/notify_telegram.sh "$(cat purge_report.txt)"; fi
