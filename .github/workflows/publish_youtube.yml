name: Publicar en YouTube (privado, para revisar)

# Baja el video final de R2, genera el paquete SEO con IA (titulo/descripcion/tags),
# y lo sube a YouTube como PRIVADO (Juan lo revisa y lo hace publico cuando quiera).
# Requiere los secrets YT_CLIENT_ID / YT_CLIENT_SECRET / YT_REFRESH_TOKEN (OAuth).

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUCKET: video-forge
  PROJECT: "0001-youtube-money"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar ffmpeg + fuentes (para la miniatura)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-liberation

      - name: Bajar video + tiempos + guion activo de R2
        run: |
          npx --yes wrangler@4 r2 object delete "$BUCKET/video/$PROJECT/render_pending.json" --remote 2>/dev/null || true
          npx --yes wrangler@4 r2 object get "$BUCKET/video/$PROJECT/video.mp4" --file=video.mp4 --remote
          npx --yes wrangler@4 r2 object get "$BUCKET/audio/$PROJECT/timing.json" --file=timing.json --remote || echo "sin timing (capitulos aproximados)"
          # Guion activo (de la fabrica) para el SEO correcto; si no, el del repo.
          npx --yes wrangler@4 r2 object get "$BUCKET/audio/$PROJECT/voicemap_full.json" --file=voicemap_active.json --remote 2>/dev/null && echo "guion de R2" || cp "projects/$PROJECT/voicemap_full.json" voicemap_active.json
          ls -la video.mp4

      - name: Generar paquete SEO con IA (titulo/descripcion/tags/capitulos/subtitulos)
        run: |
          TOPIC=$(node -e 'try{process.stdout.write(JSON.parse(require("fs").readFileSync("voicemap_active.json","utf8")).title||"data video")}catch(e){process.stdout.write("data video")}')
          echo "Tema para SEO: $TOPIC"
          node pipeline/publish_package.mjs voicemap_active.json timing.json "$TOPIC" publish

      - name: Subir a YouTube (privado)
        run: node pipeline/youtube_upload.mjs video.mp4 publish/package.json

      - name: Guardar paquete SEO + video_id en R2 (para regenerar el SEO luego)
        if: ${{ hashFiles('publish/video_id.txt') != '' }}
        run: |
          npx --yes wrangler@4 r2 object put "$BUCKET/video/$PROJECT/package.json" --file=publish/package.json --remote
          npx --yes wrangler@4 r2 object put "$BUCKET/video/$PROJECT/video_id.txt" --file=publish/video_id.txt --remote

      - name: Marcar el N como PRODUCIDO (ya está en YouTube) — cierra el ciclo, sin huecos
        if: ${{ hashFiles('publish/video_id.txt') != '' }}
        run: |
          npx --yes wrangler@4 r2 object get "$BUCKET/channel/active_n.json" --file=active_n.json --remote 2>/dev/null || echo '{}' > active_n.json
          N=$(node -e 'try{const n=JSON.parse(require("fs").readFileSync("active_n.json","utf8")).n;process.stdout.write(n?String(n):"")}catch(e){}')
          if [ -n "$N" ]; then
            npx --yes wrangler@4 r2 object get "$BUCKET/channel/produced.json" --file=produced.json --remote 2>/dev/null || echo '{"done":[]}' > produced.json
            N="$N" node -e 'const fs=require("fs");let p={done:[]};try{p=JSON.parse(fs.readFileSync("produced.json","utf8"))}catch(e){};const n=+process.env.N;if(!Array.isArray(p.done))p.done=[];if(!p.done.includes(n))p.done.push(n);fs.writeFileSync("produced.json",JSON.stringify(p));console.log("producidos:",p.done.join(","))'
            npx --yes wrangler@4 r2 object put "$BUCKET/channel/produced.json" --file=produced.json --remote --content-type application/json
            # limpiar el contador de intentos de ese N (ya salió bien)
            npx --yes wrangler@4 r2 object get "$BUCKET/channel/attempts.json" --file=attempts.json --remote 2>/dev/null && N="$N" node -e 'const fs=require("fs");let a={};try{a=JSON.parse(fs.readFileSync("attempts.json","utf8"))}catch(e){};delete a[process.env.N];fs.writeFileSync("attempts.json",JSON.stringify(a))' && npx --yes wrangler@4 r2 object put "$BUCKET/channel/attempts.json" --file=attempts.json --remote --content-type application/json || true
          fi

      - name: Miniatura automatica (Pollinations + texto) y fijarla
        if: ${{ hashFiles('publish/video_id.txt') != '' }}
        run: |
          TOPIC=$(node -e 'try{process.stdout.write(JSON.parse(require("fs").readFileSync("voicemap_active.json","utf8")).title||"data")}catch(e){process.stdout.write("data")}')
          TT=$(node -e 'try{process.stdout.write(JSON.parse(require("fs").readFileSync("publish/package.json","utf8")).thumbnail_text||"THE DATA LENS")}catch(e){process.stdout.write("THE DATA LENS")}')
          node pipeline/make_thumbnail.mjs "$TOPIC" "$TT" thumbnail.jpg
          VID=$(cat publish/video_id.txt)
          node pipeline/youtube_thumbnail.mjs "$VID" thumbnail.jpg || echo "miniatura no fijada"
          npx --yes wrangler@4 r2 object put "$BUCKET/video/$PROJECT/thumbnail.jpg" --file=thumbnail.jpg --remote --content-type image/jpeg || true
          npx --yes wrangler@4 r2 object put "$BUCKET/video/$PROJECT/thumb_${VID}.jpg" --file=thumbnail.jpg --remote --content-type image/jpeg || true
          # Registrar la etapa "miniatura" hecha para este video.
          npx --yes wrangler@4 r2 object get "$BUCKET/channel/videos.json" --file=videos.json --remote 2>/dev/null || echo '{}' > videos.json
          node pipeline/mark_stage.mjs videos.json "$(cat publish/video_id.txt)" "$TOPIC" thumbnail
          npx --yes wrangler@4 r2 object put "$BUCKET/channel/videos.json" --file=videos.json --remote --content-type application/json

      - name: Avisar a Telegram (SEO para aprobar o regenerar)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
        run: |
          if [ -f publish/youtube_result.txt ]; then
            bash pipeline/notify_telegram.sh "$(cat publish/youtube_result.txt)"
            if [ -f publish/summary.txt ]; then
              bash pipeline/notify_telegram.sh "$(cat publish/summary.txt)"$'\n\n'"👉 Revisa el SEO en la app (pestaña Control): ahí lo apruebas ✅ o lo regeneras 🔁 con tus comentarios — todo desde la app."
            fi
          else
            bash pipeline/notify_telegram.sh "❌ Fallo la subida a YouTube. Revisa los secrets/OAuth."
          fi
