name: PRUEBA footage del short de espacio (sin TTS)

# Solo para VALIDAR el footage (stock/NASA) sin gastar cuota de Gemini TTS: genera el guion real,
# usa un tono como narración (dummy) y arma el short. Sube los frames como artefacto para revisarlos.
# NO sube nada a YouTube. Disparo manual.

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Tema exacto (opcional)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      TOPIC: ${{ github.event.inputs.topic }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: FFmpeg + fuentes
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core

      - name: Guion (real)
        run: node pipeline/space_short_script.mjs script.json narration.txt

      - name: Narración DUMMY (tono 42s, sin TTS)
        run: ffmpeg -y -f lavfi -i "sine=frequency=180:duration=42:sample_rate=24000" -af "volume=0.12" -c:a libmp3lame narration.mp3

      - name: Ensamblar (footage stock/NASA)
        run: node pipeline/space_short.mjs script.json narration.mp3 short.mp4

      - name: Frames de muestra
        if: ${{ hashFiles('short.mp4') != '' }}
        run: |
          mkdir -p frames
          for t in 3 8 14 20 26 32 38 44; do ffmpeg -y -ss $t -i short.mp4 -frames:v 1 -q:v 3 "frames/f_${t}s.jpg" 2>/dev/null || true; done
          ls -la frames || true
      - name: Subir frames como artefacto
        if: ${{ hashFiles('frames/*.jpg') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: frames
          path: frames/
          retention-days: 3
