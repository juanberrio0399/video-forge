name: Pinterest auto-pin (Oddly Shorts públicos)

# Pinea a un tablero de Pinterest los Shorts PÚBLICOS de Oddly (tráfico gratis). Anti-duplicado.
# Requiere secrets PINTEREST_ACCESS_TOKEN + PINTEREST_BOARD_ID (si faltan, no hace nada).

on:
  schedule:
    - cron: "0 18 * * *"   # 1/día
  workflow_dispatch: {}

permissions:
  contents: read

env:
  BUCKET: video-forge

jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
      PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Bajar inventario público + pineados (de R2)
        run: |
          npx --yes wrangler@4 r2 object get "$BUCKET/channel/auto2/state.json" --file=auto2_state.json --remote 2>/dev/null || echo '{}' > auto2_state.json
          npx --yes wrangler@4 r2 object get "$BUCKET/channel/pinterest_pinned.json" --file=pinterest_pinned.json --remote 2>/dev/null || echo '[]' > pinterest_pinned.json
      - name: Pinear los nuevos públicos
        run: node pipeline/pinterest_pin.mjs | tee pin.txt
      - name: Guardar los pineados
        if: ${{ hashFiles('pinterest_pinned_new.json') != '' }}
        run: npx --yes wrangler@4 r2 object put "$BUCKET/channel/pinterest_pinned.json" --file=pinterest_pinned_new.json --remote --content-type application/json
