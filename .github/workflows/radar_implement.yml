name: Radar — implementar issue (Gemini)

# MOTOR CENTRAL del radar (sin Claude): implementa un issue `radar` de CUALQUIER repo de Juan.
# Clona el repo objetivo, Gemini hace las ediciones y abre RAMA + PR EN ESE repo. NUNCA mergea.
# Usa el PAT (GH_TOKEN, scope repo+workflow) que ya alcanza todos los repos -> sin secretos por repo.

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Número del issue radar"
        required: true
      repo:
        description: "owner/repo objetivo (default: video-forge)"
        default: "juanberrio0399/video-forge"

# No dos implementaciones del MISMO issue del MISMO repo a la vez (evita ramas/PR en conflicto).
concurrency:
  group: radar-implement-${{ github.event.inputs.repo }}-${{ github.event.inputs.issue }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      ISSUE: ${{ github.event.inputs.issue }}
      TARGET: ${{ github.event.inputs.repo || 'juanberrio0399/video-forge' }}
    steps:
      - uses: actions/checkout@v5        # video-forge: trae el script del motor
        with:
          path: motor
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Clonar el repo objetivo
        run: git clone --depth 50 "https://x-access-token:${GH_TOKEN}@github.com/${TARGET}.git" target
      - name: Implementar el issue con Gemini
        working-directory: target
        run: RADAR_REPO="$TARGET" node "$GITHUB_WORKSPACE/motor/pipeline/radar_implement.mjs" "$ISSUE"
      - name: Crear rama + PR (sin merge)
        working-directory: target
        run: |
          # PENDIENTE por config manual (MCP/API key/cuenta externa) o de pago -> NO es un fallo: se deja
          # el issue abierto con un aviso, sin motor-fallo (no se puede/queremos mergear sin ese paso).
          if [ -f radar_skip.txt ]; then
            REASON=$(cat radar_skip.txt)
            KIND=$(cat radar_skip_reason.txt 2>/dev/null || echo manual)
            echo "Pendiente (no se implementa): $REASON"
            gh issue edit "$ISSUE" -R "$TARGET" --remove-label motor-fallo 2>/dev/null || true
            if [ "$KIND" = "manual" ]; then
              # Config manual del dueño: marca `manual` (el bot lo muestra en "🖐️ Requiere tu configuración",
              # SIN botón de merge) y publica el PASO A PASO como checklist para que sepa qué hacer.
              STEPS=$(node -e 'const fs=require("fs");try{const s=JSON.parse(fs.readFileSync("radar_steps.json","utf8"));if(Array.isArray(s)&&s.length)process.stdout.write(s.map(x=>"- [ ] "+x).join("\n"))}catch(e){}' 2>/dev/null)
              gh label create manual -R "$TARGET" --color F2B234 --description "Requiere config manual del dueño (no se resuelve con PR)" 2>/dev/null || true
              gh issue edit "$ISSUE" -R "$TARGET" --add-label manual 2>/dev/null || true
              gh issue comment "$ISSUE" -R "$TARGET" --body "$(printf '## 🖐️ Requiere configuración manual mía\n\nEsto no se resuelve con un PR de código: %s. Pasos que debo hacer:\n\n%s\n\nCuando lo deje configurado, cierro este issue.' "$REASON" "${STEPS:-- [ ] (revisar el issue: falta detallar los pasos)}")" || true
            else
              gh issue comment "$ISSUE" -R "$TARGET" --body "⏸️ Pendiente: este issue $REASON, así que no se implementa. Queda abierto hasta decidirlo a mano." || true
            fi
            exit 0
          fi
          [ ! -f radar_pr.json ] && { echo "El motor no produjo cambios (sin PR)."; gh issue comment "$ISSUE" -R "$TARGET" --body "⚠️ El motor no pudo generar cambios para este issue. Requiere implementación manual." || true; exit 1; }
          BR=$(cat radar_branch.txt); TITLE=$(cat radar_title.txt); COMMIT=$(cat radar_commit.txt)
          COMPLETE=$(cat radar_complete.txt 2>/dev/null || echo 1)   # 1=todas las ediciones aplicaron
          BASE=$(git symbolic-ref --short HEAD)
          mv radar_body.md /tmp/radar_body.md
          rm -f radar_pr.json radar_branch.txt radar_title.txt radar_commit.txt radar_complete.txt
          # Solo un PR COMPLETO cierra el issue. Si quedó incompleto: `Ref` (no cierra) + aviso.
          if [ "$COMPLETE" = "1" ]; then CLOSE="Closes #${ISSUE}"; NOTE=""; else CLOSE="Ref #${ISSUE}"; NOTE=" (⚠️ INCOMPLETO — revisar; NO cierra el issue)"; fi
          git config user.name "Juan Berrio"
          git config user.email "juandyb99@gmail.com"
          git checkout -b "$BR"
          git add -A
          git commit -m "$COMMIT" -m "$CLOSE"
          git push -u origin "$BR" --force
          # IDEMPOTENTE: si al reintentar ya existe un PR para esta rama, el push --force ya lo actualizó;
          # NO intentamos crear uno duplicado (eso fallaba con "already exists" y marcaba motor-fallo).
          PRURL=$(gh pr view "$BR" -R "$TARGET" --json url -q .url 2>/dev/null || true)
          if [ -z "$PRURL" ]; then
            gh pr create -R "$TARGET" --base "$BASE" --head "$BR" --title "$TITLE" --body-file /tmp/radar_body.md || gh pr create -R "$TARGET" --base "$BASE" --head "$BR" --title "$TITLE" --body "$CLOSE"
            PRURL=$(gh pr view "$BR" -R "$TARGET" --json url -q .url)
            gh issue comment "$ISSUE" -R "$TARGET" --body "Branch \`$BR\` and PR ready for review (not merged)$NOTE: $PRURL"
          else
            # El PR ya existía (reintento): el force-push ya actualizó su código. Ademas REFRESCAMOS su
            # titulo y cuerpo al estado ACTUAL, para que si el reintento ya quedó completo, el PR deje de
            # decir [INCOMPLETO] y pase de `Ref` a `Closes` (y así cierre el issue al mergear) — y viceversa.
            echo "PR ya existía; rama actualizada. Refresco titulo/cuerpo al estado actual (completo/incompleto)."
            gh pr edit "$PRURL" -R "$TARGET" --title "$TITLE" --body-file /tmp/radar_body.md 2>/dev/null || true
            gh issue comment "$ISSUE" -R "$TARGET" --body "Branch \`$BR\` updated — PR already existed and now reflects the latest changes$NOTE: $PRURL"
          fi
          echo "PR: $PRURL"
          gh issue edit "$ISSUE" -R "$TARGET" --remove-label motor-fallo 2>/dev/null || true   # limpia un fallo previo
      - name: Marcar fallo del motor (si algo se rompió)
        if: failure()
        run: |
          # Cualquier paso que falle (clone, Gemini, sin ediciones, push, PR) deja rastro VISIBLE en el
          # bot: etiqueta `motor-fallo` (el bot la muestra como ❌) + comentario en el issue.
          gh label create motor-fallo -R "$TARGET" --color D73A4A --description "El motor del radar no pudo implementar el issue" 2>/dev/null || true
          gh issue edit "$ISSUE" -R "$TARGET" --add-label motor-fallo 2>/dev/null || true
          gh issue comment "$ISSUE" -R "$TARGET" --body "❌ El motor no pudo implementar este issue (falló el proceso). Requiere revisión/implementación manual — reintenta desde el bot (🔁) o hazlo a mano." || true
