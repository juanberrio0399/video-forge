name: Radar — implementar issue (Gemini)

# MOTOR CENTRAL del radar (sin Claude) para un issue `radar` de CUALQUIER repo de Juan.
# MODO PLAN (por defecto desde 2026-09-14): investiga el repo y deja un PLAN verificable en el issue, sin tocar
# código. Los PRs automáticos se pausaron: 10 de 10 fallaron la revisión a fondo. El modo `implement` (abajo)
# solo corre si se pide explícitamente; el bot nunca lo pide.
# Clona el repo objetivo, Gemini hace las ediciones y el motor las VALIDA (sintaxis, dependencias, código
# conectado, tamaño, build/tests frente a main y revisión de impacto). Solo si pasa abre RAMA + PR. NUNCA mergea.
# Tras abrir el PR vigila el CI del repo: si queda rojo, el PR pasa a borrador con `radar-ci-rojo`.
# Usa el PAT (GH_TOKEN, scope repo+workflow) que ya alcanza todos los repos -> sin secretos por repo.

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Número del issue radar"
        required: true
      repo:
        description: "owner/repo objetivo (default: video-forge)"
        default: "juanberrio0399/video-forge"
      mode:
        description: "plan (deja un plan en el issue) | implement (abre PR; pausado)"
        default: "plan"

# No dos implementaciones del MISMO issue del MISMO repo a la vez (evita ramas/PR en conflicto).
concurrency:
  group: radar-implement-${{ github.event.inputs.repo }}-${{ github.event.inputs.issue }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      ISSUE: ${{ github.event.inputs.issue }}
      TARGET: ${{ github.event.inputs.repo || 'juanberrio0399/video-forge' }}
    steps:
      - uses: actions/checkout@v5        # video-forge: trae el script del motor
        with:
          path: motor
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-python@v6    # tomllib (3.11+) para validar TOML y proyectos Python
        with:
          python-version: "3.12"
      - name: Preparar validadores
        run: python -m pip install -q pyyaml
      - name: Limpiar el estado anterior del issue
        run: |
          # Un reintento empieza de cero: fuera las marcas de la corrida anterior.
          for L in motor-fallo radar-no-valida radar-descartado radar-plan; do
            gh issue edit "$ISSUE" -R "$TARGET" --remove-label "$L" 2>/dev/null || true
          done
      - name: Clonar el repo objetivo
        run: git clone --depth 50 "https://x-access-token:${GH_TOKEN}@github.com/${TARGET}.git" target
      - name: Preparar el plan
        if: github.event.inputs.mode != 'implement'
        working-directory: target
        run: |
          RADAR_REPO="$TARGET" node "$GITHUB_WORKSPACE/motor/pipeline/radar_plan.mjs" "$ISSUE"
          gh label create radar-plan -R "$TARGET" --color 1D76DB --description "Radar dejó un plan de implementación" 2>/dev/null || true
          while IFS= read -r L; do
            [ -n "$L" ] && gh issue edit "$ISSUE" -R "$TARGET" --add-label "$L" 2>/dev/null || true
          done < radar_plan_labels.txt
          gh issue comment "$ISSUE" -R "$TARGET" --body-file radar_plan.md
      - name: Implementar y validar el issue
        if: github.event.inputs.mode == 'implement'
        working-directory: target
        run: RADAR_REPO="$TARGET" node "$GITHUB_WORKSPACE/motor/pipeline/radar_implement.mjs" "$ISSUE"
      - name: Crear rama + PR (sin merge)
        if: github.event.inputs.mode == 'implement'
        id: pr
        working-directory: target
        run: |
          # PENDIENTE por config manual (MCP/API key/cuenta externa/archivos protegidos) o de pago -> NO es un
          # fallo: se deja el issue abierto con el paso a paso, sin motor-fallo.
          if [ -f radar_skip.txt ]; then
            REASON=$(cat radar_skip.txt)
            KIND=$(cat radar_skip_reason.txt 2>/dev/null || echo manual)
            echo "Pendiente (no se implementa): $REASON"
            if [ "$KIND" = "manual" ]; then
              STEPS=$(node -e 'const fs=require("fs");try{const s=JSON.parse(fs.readFileSync("radar_steps.json","utf8"));if(Array.isArray(s)&&s.length)process.stdout.write(s.map(x=>"- [ ] "+x).join("\n"))}catch(e){}' 2>/dev/null)
              gh label create manual -R "$TARGET" --color F2B234 --description "Requiere config manual del dueño (no se resuelve con PR)" 2>/dev/null || true
              gh issue edit "$ISSUE" -R "$TARGET" --add-label manual 2>/dev/null || true
              gh issue comment "$ISSUE" -R "$TARGET" --body "$(printf '## 🖐️ Requiere configuración manual mía\n\nEsto no se resuelve con un PR de código: %s. Pasos que debo hacer:\n\n%s\n\nCuando lo deje configurado, cierro este issue.' "$REASON" "${STEPS:-- [ ] (revisar el issue: falta detallar los pasos)}")" || true
            else
              gh issue comment "$ISSUE" -R "$TARGET" --body "⏸️ Pendiente: este issue $REASON, así que no se implementa. Queda abierto hasta decidirlo a mano." || true
            fi
            exit 0
          fi

          # NO VALIDA o RECHAZADO -> sin PR. El issue explica exactamente qué falló.
          for KIND in invalid rejected; do
            F="radar_${KIND}.json"
            [ -f "$F" ] || continue
            if [ "$KIND" = "invalid" ]; then
              LABEL=radar-no-valida; COLOR=B60205; DESC="El cambio no pasó la validación del motor"
              HEAD="## ⛔ No abrí PR: el cambio no pasó la validación"
              TAIL="Lo intenté reparar 2 veces. Reintenta desde Radar (🔁) o impleméntalo a mano."
            else
              LABEL=radar-descartado; COLOR=6E7781; DESC="Revisión: sin impacto suficiente o no verificable"
              HEAD="## 🗑️ Descartado en revisión"
              TAIL="Si igual lo quieres, replantea el issue con un alcance de mayor impacto y reintenta."
            fi
            LIST=$(node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));const l=(r.problems||[]).map(p=>"- **"+p.kind+"**"+(p.file?" `"+p.file+"`":"")+": "+String(p.detail).replace(/\n+/g," ").slice(0,500));if(r.impact)l.unshift("- **impacto**: "+r.impact);if(r.review)l.push("","> "+r.review);process.stdout.write(l.join("\n"))' "$F")
            gh label create "$LABEL" -R "$TARGET" --color "$COLOR" --description "$DESC" 2>/dev/null || true
            gh issue edit "$ISSUE" -R "$TARGET" --add-label "$LABEL" 2>/dev/null || true
            gh issue comment "$ISSUE" -R "$TARGET" --body "$(printf '%s\n\n%s\n\n%s' "$HEAD" "$LIST" "$TAIL")" || true
            echo "Sin PR ($LABEL)."
            exit 0
          done

          [ ! -f radar_pr.json ] && { echo "El motor no produjo cambios (sin PR)."; exit 1; }
          BR=$(cat radar_branch.txt); TITLE=$(cat radar_title.txt); COMMIT=$(cat radar_commit.txt)
          COMPLETE=$(cat radar_complete.txt 2>/dev/null || echo 1)
          DRAFT=$(cat radar_draft.txt 2>/dev/null || echo 0)
          BASE=$(git symbolic-ref --short HEAD)
          mv radar_body.md /tmp/radar_body.md
          mv radar_changed.txt /tmp/radar_changed.txt
          rm -f radar_*.json radar_*.txt
          if [ "$COMPLETE" = "1" ]; then CLOSE="Closes #${ISSUE}"; NOTE=""; else CLOSE="Ref #${ISSUE}"; NOTE=" (⚠️ INCOMPLETO — revisar; NO cierra el issue)"; fi
          git config user.name "Juan Berrio"
          git config user.email "juandyb99@gmail.com"
          git checkout -b "$BR"
          # Solo los archivos que el motor cambió y validó (nunca `git add -A`: arrastraba basura y diffs gigantes).
          git reset -q
          while IFS= read -r f; do [ -n "$f" ] && git add -- "$f"; done < /tmp/radar_changed.txt
          git diff --cached --quiet && { echo "Nada que commitear tras validar."; exit 1; }
          git diff --cached --stat
          git commit -m "$COMMIT" -m "$CLOSE"
          git push -u origin "$BR" --force
          # Solo PRs ABIERTOS de esta rama (uno cerrado antes no se reutiliza).
          PRURL=$(gh pr list -R "$TARGET" --head "$BR" --state open --json url -q '.[0].url' 2>/dev/null || true)
          if [ -z "$PRURL" ]; then
            DFLAG=""; [ "$DRAFT" = "1" ] && DFLAG="--draft"
            gh pr create -R "$TARGET" --base "$BASE" --head "$BR" --title "$TITLE" --body-file /tmp/radar_body.md $DFLAG
            PRURL=$(gh pr list -R "$TARGET" --head "$BR" --state open --json url -q '.[0].url')
            gh issue comment "$ISSUE" -R "$TARGET" --body "Validated change ready for review (not merged)$NOTE: $PRURL"
          else
            gh pr edit "$PRURL" -R "$TARGET" --title "$TITLE" --body-file /tmp/radar_body.md 2>/dev/null || true
            gh pr ready "$PRURL" -R "$TARGET" 2>/dev/null || true
            gh pr edit "$PRURL" -R "$TARGET" --remove-label radar-ci-rojo 2>/dev/null || true
            [ "$DRAFT" = "1" ] && gh pr ready "$PRURL" -R "$TARGET" --undo 2>/dev/null || true
            gh issue comment "$ISSUE" -R "$TARGET" --body "Branch \`$BR\` updated with a validated change$NOTE: $PRURL"
          fi
          echo "url=$PRURL" >> "$GITHUB_OUTPUT"
          echo "PR: $PRURL"
      - name: Vigilar el CI del PR
        if: steps.pr.outputs.url != ''
        env:
          PRURL: ${{ steps.pr.outputs.url }}
        run: |
          # Da tiempo a que el repo registre sus checks. Sin CI -> no hay nada que vigilar.
          sleep 45
          OUT=$(gh pr checks "$PRURL" -R "$TARGET" 2>&1 || true)
          if echo "$OUT" | grep -qi "no checks reported"; then echo "El repo no tiene CI para este PR."; exit 0; fi
          set +e
          timeout 1200 gh pr checks "$PRURL" -R "$TARGET" --watch --interval 30 > /tmp/checks.txt 2>&1
          CODE=$?
          set -e
          cat /tmp/checks.txt | tail -20
          if [ "$CODE" = "0" ]; then echo "CI en verde."; exit 0; fi
          if [ "$CODE" = "124" ]; then echo "El CI sigue corriendo tras 20 min; el bot no deja mergear hasta que termine."; exit 0; fi
          FAILED=$(gh pr checks "$PRURL" -R "$TARGET" --json name,bucket -q '[.[] | select(.bucket=="fail" or .bucket=="cancel") | .name] | join(", ")' 2>/dev/null || echo "revisar checks")
          gh label create radar-ci-rojo -R "$TARGET" --color B60205 --description "El CI del PR falla: no mergear" 2>/dev/null || true
          gh pr edit "$PRURL" -R "$TARGET" --add-label radar-ci-rojo 2>/dev/null || true
          gh pr ready "$PRURL" -R "$TARGET" --undo 2>/dev/null || true
          gh pr comment "$PRURL" -R "$TARGET" --body "⛔ CI failing (${FAILED}). Moved back to draft; do not merge until it is green." || true
      - name: Marcar fallo del motor (si algo se rompió)
        if: failure()
        run: |
          gh label create motor-fallo -R "$TARGET" --color D73A4A --description "El motor del radar no pudo implementar el issue" 2>/dev/null || true
          gh issue edit "$ISSUE" -R "$TARGET" --add-label motor-fallo 2>/dev/null || true
          gh issue comment "$ISSUE" -R "$TARGET" --body "❌ El motor no pudo implementar este issue (falló el proceso). Reintenta desde Radar (🔁) o hazlo a mano." || true
