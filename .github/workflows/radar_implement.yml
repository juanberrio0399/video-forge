name: Radar — implementar issue (Gemini)

# MOTOR CENTRAL del radar (sin Claude): implementa un issue `radar` de CUALQUIER repo de Juan.
# Clona el repo objetivo, Gemini hace las ediciones y abre RAMA + PR EN ESE repo. NUNCA mergea.
# Usa el PAT (GH_TOKEN, scope repo+workflow) que ya alcanza todos los repos -> sin secretos por repo.

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Número del issue radar"
        required: true
      repo:
        description: "owner/repo objetivo (default: video-forge)"
        default: "juanberrio0399/video-forge"

# No dos implementaciones del MISMO issue del MISMO repo a la vez (evita ramas/PR en conflicto).
concurrency:
  group: radar-implement-${{ github.event.inputs.repo }}-${{ github.event.inputs.issue }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      ISSUE: ${{ github.event.inputs.issue }}
      TARGET: ${{ github.event.inputs.repo || 'juanberrio0399/video-forge' }}
    steps:
      - uses: actions/checkout@v4        # video-forge: trae el script del motor
        with:
          path: motor
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Clonar el repo objetivo
        run: git clone --depth 50 "https://x-access-token:${GH_TOKEN}@github.com/${TARGET}.git" target
      - name: Implementar el issue con Gemini
        working-directory: target
        run: RADAR_REPO="$TARGET" node "$GITHUB_WORKSPACE/motor/pipeline/radar_implement.mjs" "$ISSUE"
      - name: Crear rama + PR (sin merge)
        working-directory: target
        run: |
          [ ! -f radar_pr.json ] && { echo "El motor no produjo cambios (sin PR)."; gh issue comment "$ISSUE" -R "$TARGET" --body "⚠️ El motor no pudo generar cambios para este issue. Requiere implementación manual." || true; exit 1; }
          BR=$(cat radar_branch.txt); TITLE=$(cat radar_title.txt); COMMIT=$(cat radar_commit.txt)
          COMPLETE=$(cat radar_complete.txt 2>/dev/null || echo 1)   # 1=todas las ediciones aplicaron
          BASE=$(git symbolic-ref --short HEAD)
          mv radar_body.md /tmp/radar_body.md
          rm -f radar_pr.json radar_branch.txt radar_title.txt radar_commit.txt radar_complete.txt
          # Solo un PR COMPLETO cierra el issue. Si quedó incompleto: `Ref` (no cierra) + aviso.
          if [ "$COMPLETE" = "1" ]; then CLOSE="Closes #${ISSUE}"; NOTE=""; else CLOSE="Ref #${ISSUE}"; NOTE=" (⚠️ INCOMPLETO — revisar; NO cierra el issue)"; fi
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git checkout -b "$BR"
          git add -A
          git commit -m "$COMMIT" -m "Implementado por el motor del radar (Gemini). Revisar antes de merge. $CLOSE"
          git push -u origin "$BR" --force
          gh pr create -R "$TARGET" --base "$BASE" --head "$BR" --title "$TITLE" --body-file /tmp/radar_body.md || gh pr create -R "$TARGET" --base "$BASE" --head "$BR" --title "$TITLE" --body "$CLOSE"
          PRURL=$(gh pr view "$BR" -R "$TARGET" --json url -q .url)
          echo "PR: $PRURL"
          gh issue comment "$ISSUE" -R "$TARGET" --body "🤖 Rama \`$BR\` y PR listos para revisar (sin merge)$NOTE: $PRURL"
          gh issue edit "$ISSUE" -R "$TARGET" --remove-label motor-fallo 2>/dev/null || true   # limpia un fallo previo
      - name: Marcar fallo del motor (si algo se rompió)
        if: failure()
        run: |
          # Cualquier paso que falle (clone, Gemini, sin ediciones, push, PR) deja rastro VISIBLE en el
          # bot: etiqueta `motor-fallo` (el bot la muestra como ❌) + comentario en el issue.
          gh label create motor-fallo -R "$TARGET" --color D73A4A --description "El motor del radar no pudo implementar el issue" 2>/dev/null || true
          gh issue edit "$ISSUE" -R "$TARGET" --add-label motor-fallo 2>/dev/null || true
          gh issue comment "$ISSUE" -R "$TARGET" --body "❌ El motor no pudo implementar este issue (falló el proceso). Requiere revisión/implementación manual — reintenta desde el bot (🔁) o hazlo a mano." || true
