name: Auto-optimizar Oddly (cadencia por datos)

# Cada lunes: MOTOR ÚNICO de reparto (auditoría BR-04). Ranking por mediana de la cohorte de 5-30 días,
# escalado de volumen solo si la cohorte reciente no se diluye, experimento de nicho con muestra real.
# Escribe la cadencia QUE SE EJECUTA y decision.json con exactamente ese reparto, y registra la decisión
# en el ledger con predicción y fecha de revisión. Avisa por Telegram qué movió y por qué.
on:
  schedule:
    - cron: "0 14 * * 1"   # lunes 14:00 UTC = 9:00 a.m. Bogota
  workflow_dispatch: {}

permissions:
  contents: read

env:
  BUCKET: video-forge

jobs:
  optimizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Bajar datos, cadencia, experimentos, ledger
        run: |
          npx --yes wrangler@4 r2 object get "$BUCKET/channel/auto2/state.json" --file=state.json --remote 2>/dev/null || echo '{}' > state.json
          npx --yes wrangler@4 r2 object get "$BUCKET/channel/auto2/cadence.json" --file=cadence.json --remote 2>/dev/null || cp channel/auto2/cadence.seed.json cadence.json
          npx --yes wrangler@4 r2 object get "$BUCKET/channel/auto2/experiments_niche.json" --file=exp.json --remote 2>/dev/null || cp channel/auto2/experiments_niche.json exp.json
          npx --yes wrangler@4 r2 object get "$BUCKET/channel/brain/aggressiveness.json" --file=aggressiveness.json --remote 2>/dev/null || echo '{}' > aggressiveness.json
          npx --yes wrangler@4 r2 object get "$BUCKET/channel/auto2/views_at_age.json" --file=views_at_age.json --remote 2>/dev/null || echo '{}' > views_at_age.json
          npx --yes wrangler@4 r2 object get "$BUCKET/channel/brain/ledger.json" --file=ledger.json --remote 2>/dev/null || echo '[]' > ledger.json

      - name: Motor único de reparto
        run: node pipeline/rebalance_oddly.mjs

      - name: Aplicar a R2 (cadencia + experimentos + decisión ejecutada + ledger)
        run: |
          npx --yes wrangler@4 r2 object put "$BUCKET/channel/auto2/cadence.json" --file=cadence.new.json --content-type application/json --remote
          npx --yes wrangler@4 r2 object put "$BUCKET/channel/auto2/experiments_niche.json" --file=exp.new.json --content-type application/json --remote
          npx --yes wrangler@4 r2 object put "$BUCKET/channel/brain/decision.json" --file=decision.json --content-type application/json --remote
          npx --yes wrangler@4 r2 object put "$BUCKET/channel/brain/ledger.json" --file=ledger.new.json --content-type application/json --remote

      - name: Avisar por Telegram
        run: |
          bash pipeline/notify_telegram.sh "$(printf '🤖 Oddly Loop — reparto semanal (motor único):\n\n%s' "$(cat summary.txt)")"
