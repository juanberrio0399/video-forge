name: Auto-optimizar Oddly (cadencia por datos)

# Cada lunes: lee las vistas/dia por nicho, RECALCULA la cadencia (sube el ganador, corta el
# flojo), maneja el slot de experimento (promueve/descarta segun rinda), lo APLICA en R2 y te
# avisa por Telegram que movio y por que. Antes solo recordaba; ahora lo hace AUTOMATICO.
# Todo en la nube (GitHub + R2 + Telegram), sin PC. NO toca lo publicado ni programado.
on:
  schedule:
    - cron: "0 14 * * 1"   # lunes 14:00 UTC = 9:00 a.m. Bogota
  workflow_dispatch: {}

permissions:
  contents: read

env:
  BUCKET: video-forge

jobs:
  optimizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Bajar datos + cadencia + experimentos
        run: |
          npx --yes wrangler@4 r2 object get "$BUCKET/channel/auto2/state.json" --file=state.json --remote 2>/dev/null || echo '{}' > state.json
          npx --yes wrangler@4 r2 object get "$BUCKET/channel/auto2/cadence.json" --file=cadence.json --remote 2>/dev/null || cp channel/auto2/cadence.seed.json cadence.json
          npx --yes wrangler@4 r2 object get "$BUCKET/channel/auto2/experiments_niche.json" --file=exp.json --remote 2>/dev/null || cp channel/auto2/experiments_niche.json exp.json
          npx --yes wrangler@4 r2 object get "$BUCKET/channel/brain/aggressiveness.json" --file=aggressiveness.json --remote 2>/dev/null || echo '{}' > aggressiveness.json

      - name: Recalcular la cadencia (auto-optimizador)
        run: node pipeline/rebalance_oddly.mjs

      - name: Aplicar a R2 (cadencia + experimentos)
        run: |
          npx --yes wrangler@4 r2 object put "$BUCKET/channel/auto2/cadence.json" --file=cadence.new.json --content-type application/json --remote
          npx --yes wrangler@4 r2 object put "$BUCKET/channel/auto2/experiments_niche.json" --file=exp.new.json --content-type application/json --remote

      - name: Avisar por Telegram
        run: |
          bash pipeline/notify_telegram.sh "$(printf '🤖 Oddly Loop — auto-optimizacion semanal:\n\n%s' "$(cat summary.txt)")"
