name: Subir a Bilibili (Playwright — Studio)

# Sube un video a Bilibili Studio automatizando el navegador con Playwright, EN LA NUBE (headless,
# GitHub Actions — NO depende del PC de Juan). Usa la cookie web del creador (secret BILIBILI_COOKIE),
# la misma con la que sube a mano. Deja capturas (shots/) + DOM (page.html) como artefacto para validar.
#
# FASES: F1 piloto (este, manual, validar) → F2 repostear autom. los Shorts públicos de Oddly → F3 watchdog cookie.
on:
  workflow_dispatch:
    inputs:
      r2_key:
        description: "Ruta del MP4 en R2 (p.ej. channel/oddly/last_short.mp4)"
        required: true
        default: "channel/oddly/last_short.mp4"
      title:
        description: "Título del video"
        required: true
      desc:
        description: "Descripción"
        required: false
        default: "Relaxing space visuals. Follow for more."
      tag:
        description: "Tags separados por coma"
        required: false
        default: "relaxing,space,asmr,sleep"

permissions:
  contents: read

env:
  BUCKET: video-forge

jobs:
  subir:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BILIBILI_COOKIE: ${{ secrets.BILIBILI_COOKIE }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
      BILI_TITLE: ${{ inputs.title }}
      BILI_DESC: ${{ inputs.desc }}
      BILI_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Verificar cookie
        run: |
          if [ -z "$BILIBILI_COOKIE" ]; then echo "❌ Falta el secret BILIBILI_COOKIE."; exit 1; fi
          echo "cookie presente"
      - name: Bajar el video de R2
        run: |
          npx --yes wrangler@4 r2 object get "$BUCKET/${{ inputs.r2_key }}" --file=video.mp4 --remote
          ls -lh video.mp4
      - name: Instalar Playwright (Chromium)
        run: |
          npm i -D playwright@1.48.0
          npx playwright install --with-deps chromium
      - name: Subir con Playwright a Bilibili Studio
        run: node pipeline/bilibili_playwright.mjs video.mp4
      - name: Guardar evidencia (capturas + DOM)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bilibili-evidence
          path: |
            shots/
            page.html
            result.txt
          retention-days: 5
      - name: Avisar a Telegram
        if: always()
        run: |
          if grep -qi "^OK" result.txt 2>/dev/null; then
            MSG="✅ Bilibili: subí «${{ inputs.title }}» vía Studio (revisa que quedó en tu canal / en revisión)."
          else
            MSG="⚠️ Bilibili: la subida de «${{ inputs.title }}» no se confirmó. Mira el artefacto 'bilibili-evidence' (capturas) para ajustar."
          fi
          bash pipeline/notify_telegram.sh "$MSG" || true
