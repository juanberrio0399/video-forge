name: Registro de hipótesis -> R2

# Brain OS Fase 3: mantiene el registro de hipótesis (§17) en channel/brain/hypotheses.json.
# Idempotente: asegura las semillas y recalcula estados. Las fases 4/5 le añadirán evidencia
# desde los episodios (hooks/formatos). Nada de producción lo consume aún.

on:
  schedule:
    - cron: "30 14 * * *"   # diario 14:30 UTC (tras episodios)
  workflow_dispatch: {}

permissions:
  contents: read

env:
  BUCKET: video-forge

jobs:
  hypotheses:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Mantener el registro de hipótesis
        run: |
          npx --yes wrangler@4 r2 object get "$BUCKET/channel/brain/hypotheses.json" --file=hypotheses.json --remote 2>/dev/null || echo '[]' > hypotheses.json
          node pipeline/hypotheses.mjs hypotheses.json hypotheses.json
          npx --yes wrangler@4 r2 object put "$BUCKET/channel/brain/hypotheses.json" --file=hypotheses.json --remote --content-type application/json
