name: Generate voiceover (Kokoro TTS)

# Fase 1.3: genera la voz en off con Kokoro-82M (gratis, Apache 2.0) en la nube
# y la normaliza a -14 LUFS (estandar YouTube). Sube WAV + MP3 como artifact.

on:
  workflow_dispatch:
    inputs:
      voice:
        description: "Voz Kokoro (af_heart | af_bella | am_michael | bm_george)"
        required: false
        default: "af_heart"
      narration:
        description: "Ruta del archivo de narracion"
        required: false
        default: "projects/0001-youtube-money/narration.txt"
  push:
    branches: [main]
    paths:
      - "projects/**/narration.txt"
      - "pipeline/tts_kokoro.py"
      - ".github/workflows/voice.yml"

permissions:
  contents: read

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NARRATION: ${{ github.event.inputs.narration || 'projects/0001-youtube-money/narration.txt' }}
      VOICE: ${{ github.event.inputs.voice || 'af_heart' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install espeak-ng + ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg

      - name: Install Kokoro (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install kokoro soundfile numpy

      - name: Synthesize voiceover
        run: |
          mkdir -p renders
          python pipeline/tts_kokoro.py "$NARRATION" renders/voiceover_raw.wav "$VOICE"

      - name: Normalize to -14 LUFS + export MP3
        run: |
          ffmpeg -y -i renders/voiceover_raw.wav \
            -af "highpass=f=80,loudnorm=I=-14:TP=-1.5:LRA=11" \
            -ar 48000 renders/voiceover.wav
          ffmpeg -y -i renders/voiceover.wav -codec:a libmp3lame -q:a 2 renders/voiceover.mp3
          ls -la renders/

      - name: Upload voiceover
        uses: actions/upload-artifact@v4
        with:
          name: voiceover
          path: |
            renders/voiceover.mp3
            renders/voiceover.wav
          if-no-files-found: error
          retention-days: 14
