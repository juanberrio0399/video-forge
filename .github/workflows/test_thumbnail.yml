name: TEST miniatura (muestra, one-off)

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Tema"
        required: false
        default: "How much money 1,000,000 YouTube views actually pays"
      text:
        description: "Texto de la miniatura"
        required: false
        default: "1M VIEWS = $50K?"

permissions:
  contents: read

jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: ffmpeg + fuentes
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-liberation
      - name: Generar miniatura de muestra
        env:
          TOPIC: ${{ github.event.inputs.topic }}
          TEXT: ${{ github.event.inputs.text }}
        run: node pipeline/make_thumbnail.mjs "$TOPIC" "$TEXT" thumbnail.jpg
      - name: Mandarla al chat
        if: always()
        run: |
          if [ -f thumbnail.jpg ]; then
            bash pipeline/notify_telegram.sh "🖼️ Miniatura de MUESTRA (así saldrán automáticas al publicar). ¿Te gusta el estilo?" thumbnail.jpg
          else
            bash pipeline/notify_telegram.sh "❌ No se pudo generar la miniatura de muestra."
          fi
