name: Limpiar respuestas en español (one-shot)

on:
  workflow_dispatch:
    inputs:
      label:
        description: "canal: oddly | data-lens"
        default: "oddly"
      hours:
        description: "borrar mis respuestas en español de las últimas N horas"
        default: "6"

permissions:
  contents: read

env:
  BUCKET: video-forge

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      YT_CLIENT_ID: ${{ secrets.YT2_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT2_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT2_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Borrar respuestas en español
        run: node pipeline/comment_cleanup.mjs "${{ github.event.inputs.label }}" "${{ github.event.inputs.hours }}"
