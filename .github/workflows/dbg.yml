name: dbg
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BUCKET: video-forge
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          g(){ npx --yes wrangler@4 r2 object get "$BUCKET/$1" --file="$2" --remote 2>/dev/null || echo "{}" > "$2"; }
          g channel/videos.json videos.json
          g shorts/0001-youtube-money/plan.json plan.json
          node -e '
            const fs=require("fs");const rd=p=>{try{return JSON.parse(fs.readFileSync(p,"utf8"))}catch(e){return {}}};
            const v=rd("videos.json");console.log("=== VIDEOS.JSON ===");for(const k in v)console.log(k,JSON.stringify(v[k].stages||{}),"|",(v[k].title||"").slice(0,30));
            const p=rd("plan.json");console.log("=== PLAN ===","for_video_id:",p.for_video_id);
            (p.shorts||[]).forEach(s=>console.log("  n="+s.n,"approved="+s.approved,"skipped="+s.skipped,"video_id="+(s.video_id||"-"),"|",(s.title||"").slice(0,34)));
          '
