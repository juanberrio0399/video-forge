name: Cadencia diaria de Oddly Loop (por categoria)

# Cada dia produce y PROGRAMA N videos por categoria (segun channel/auto2/cadence.json o el
# seed). RAMP inicial = 1 por categoria (4/dia): Satisfying, Narrativas, Ciencia+humor, Naturaleza.
# Cada uno se nombra con su categoria (niche_map) y se programa a la siguiente mejor hora libre.
# Escala subiendo los numeros en cadence.json. Dispara produce_oddly con el PAT (GH_TOKEN).

on:
  schedule:
    - cron: "30 12 * * *"   # 12:30 UTC diario
  workflow_dispatch: {}

permissions:
  contents: read

env:
  BUCKET: video-forge

jobs:
  fanout:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
      # YT2 -> YT: para leer los publishAt YA agendados (scheduled_times) y topar la cola.
      YT_CLIENT_ID: ${{ secrets.YT2_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT2_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT2_REFRESH_TOKEN }}
      BUFFER_HOURS: "30"   # buffer de publicación ~1 día: si la cola pasa esto, hoy no se produce (drena)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Blitz de Shorts + largo del dia (nombrando la categoria)
        run: |
          # Cadencia: R2 (channel/auto2/cadence.json) si existe; si no, el seed del repo.
          npx --yes wrangler@4 r2 object get "$BUCKET/channel/auto2/cadence.json" --file=cadence.json --remote 2>/dev/null || cp channel/auto2/cadence.seed.json cadence.json
          export DOY=$(date -u +%j)   # dia del anio -> rota el nicho del largo
          # Arma el plan: N Shorts por categoria + long_per_day largos (rotando nicho). Compatible
          # con el formato viejo (per_category_per_day + kind).
          node -e '
            const c=JSON.parse(require("fs").readFileSync("cadence.json","utf8"));
            c.long_per_day=0; if(c.kind)c.kind="short";   // Oddly = SOLO shorts (decision de Juan): nada de largos 16:9, ni desde R2
            const va=c.variant||{}; const out=[];
            if(c.shorts_per_category){
              for(const [niche,n] of Object.entries(c.shorts_per_category)){ for(let i=0;i<(+n||0);i++) out.push(niche+" "+(va[niche]||"narrado")+" short"); }
              const rot=c.long_rotation||Object.keys(c.shorts_per_category);
              const doy=parseInt(process.env.DOY||"0",10);
              for(let i=0;i<(+c.long_per_day||0);i++){ const niche=rot[(doy+i)%rot.length]; out.push(niche+" "+(va[niche]||"narrado")+" video"); }
            } else {
              const per=c.per_category_per_day||{}, kind=c.kind||"video";
              for(const [niche,n] of Object.entries(per)){ for(let i=0;i<(+n||0);i++) out.push(niche+" "+(va[niche]||"narrado")+" "+kind); }
            }
            require("fs").writeFileSync("plan.txt", out.join("\n")+"\n");
            console.log("Plan de hoy ("+out.length+" piezas):\n"+out.map(l=>"  - "+l).join("\n"));
          '
          # --- Topar la cola (Brain OS): recorta el plan a lo que cabe en el buffer ~24-30h. Si la
          # cola ya lo cubre, hoy NO se produce y drena -> el cerebro ve resultados a ~1 dia, no ~1 semana.
          npx --yes wrangler@4 r2 object get "$BUCKET/channel/auto2/best_hours.json" --file=best_hours.json --remote 2>/dev/null || true
          OCC=$(node pipeline/scheduled_times.mjs || true)
          FREE=$(node pipeline/plan_capacity.mjs plan.txt "$OCC" "$BUFFER_HOURS" queue.json)
          npx --yes wrangler@4 r2 object put "$BUCKET/channel/auto2/queue.json" --file=queue.json --content-type application/json --remote || true
          KEEP=$(grep -c . plan.txt || true); KEEP=${KEEP:-0}
          CLIPBUDGET=$(( FREE - KEEP )); [ "$CLIPBUDGET" -lt 0 ] && CLIPBUDGET=0; [ "$CLIPBUDGET" -gt 3 ] && CLIPBUDGET=3
          echo "CLIPBUDGET=$CLIPBUDGET" >> "$GITHUB_ENV"
          echo "Cupos libres en buffer=$FREE · narrados a producir=$KEEP · clips presupuestados=$CLIPBUDGET"
          if [ ! -s plan.txt ] && [ "$CLIPBUDGET" -eq 0 ]; then
            AHEAD=$(node -e 'try{const q=require("./queue.json");process.stdout.write(q.scheduled_ahead+" agendados hasta "+String(q.last_publish_at||"").slice(0,16))}catch(e){process.stdout.write("llena")}')
            bash pipeline/notify_telegram.sh "🧠 Oddly Loop — la cola ya cubre ~${BUFFER_HOURS}h (${AHEAD}). Hoy NO produzco: dejo que drene para ver resultados y aprender a ~1 dia." || true
          fi
          LABEL() { case "$1" in satisfying) echo "Satisfying/ASMR";; narrativas) echo "Narrativas";; ciencia_humor) echo "Ciencia+humor";; naturaleza_relax) echo "Naturaleza";; *) echo "$1";; esac; }
          FIRST=1
          while read -r NICHE VARIANT KIND; do
            [ -z "$NICHE" ] && continue
            # ~5 min entre disparos para que el agendado quede ESCALONADO (best_slot reparte + tope 2/hora).
            if [ "$FIRST" = "0" ]; then sleep 300; fi
            FIRST=0
            echo "▶ $(LABEL "$NICHE") ($VARIANT, $KIND)"
            gh workflow run produce_oddly.yml -f niche="$NICHE" -f variant="$VARIANT" -f kind="$KIND" -f publish=yes -R "$GITHUB_REPOSITORY" || echo "no pude disparar $NICHE"
          done < plan.txt
          # `grep -c` sale con código 1 cuando cuenta 0 (p.ej. Oddly es solo-Shorts -> 0 largos); con set -e
          # eso tumbaría el step DESPUÉS de haber disparado todo. `|| true` conserva el "0" sin fallar.
          N=$(grep -c . plan.txt || true); SH=$(grep -c " short$" plan.txt || true); LO=$(grep -c " video$" plan.txt || true)
          if [ "${N:-0}" -gt 0 ]; then
            bash pipeline/notify_telegram.sh "🚀 Oddly Loop — blitz del día: lancé ${N} piezas (${SH} Shorts + ${LO} largo), topado a la capacidad del buffer (~${BUFFER_HOURS}h). Cada una a su mejor hora libre (tope 2/hora)." || true
          fi
      - name: Clips graciosos del día (Archive.org CC, rotación de fails) → AUTO-PROGRAMADOS
        if: always()   # independiente del blitz de arriba: no lo saltes si aquel tropieza
        run: |
          # Rotación de temas de fails/graciosos por día del año. Auto-programados (publish=yes): pasan la
          # PUERTA de compliance y se agendan solos a la mejor hora. Juan despublica cualquiera que no le guste.
          TOPICS=("funny fails" "epic fail" "funny animals" "bloopers" "skate fails" "funny cats" "funny dogs" "gaming fails" "sports fails" "funny moments" "animal fails" "fail compilation")
          DOY=$(date -u +%j); NT=${#TOPICS[@]}
          T1="${TOPICS[$((10#$DOY % NT))]}"
          T2="${TOPICS[$(((10#$DOY + 4) % NT))]}"
          T3="${TOPICS[$(((10#$DOY + 8) % NT))]}"
          # Presupuestados al cupo del buffer (CLIPBUDGET lo fijó el paso anterior; si no existe, 3).
          SEL=("$T1" "$T2" "$T3"); SEL=("${SEL[@]:0:${CLIPBUDGET:-3}}")
          if [ "${#SEL[@]}" -eq 0 ]; then
            echo "Sin cupo de buffer para clips hoy — la cola drena."
          else
            for T in "${SEL[@]}"; do
              echo "▶ Clip gracioso (Archive CC): $T"
              gh workflow run clip_archive_cc.yml -f topic="$T" -f niche="graciosos" -f publish=yes -R "$GITHUB_REPOSITORY" || echo "no pude disparar $T"
              sleep 60
            done
            bash pipeline/notify_telegram.sh "😹 Oddly Loop — ${#SEL[@]} clip(s) gracioso(s) del día (Archive CC) → AUTO-PROGRAMADOS (se publican solos; despublica los que no te gusten)." || true
          fi
