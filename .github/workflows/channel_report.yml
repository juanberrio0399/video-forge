name: Reporte del canal (seguimiento + programacion)

# Centro de direccion: jala metricas reales (subs, vistas, likes, monetizacion) de cada
# video publicado, actualiza el estado del canal en R2 y manda el reporte al chat.

on:
  schedule:
    - cron: "20 */6 * * *"   # cada 6h: mantiene FRESCO el estado de The Data Lens (vistas, top, mejores horas)
  workflow_dispatch:

permissions:
  contents: read

env:
  BUCKET: video-forge

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      GH_REPO: ${{ github.repository }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Cargar estado del canal (R2, o la semilla del repo la 1a vez)
        run: |
          if npx --yes wrangler@4 r2 object get "$BUCKET/channel/state.json" --file=state.json --remote 2>/dev/null; then
            echo "estado cargado de R2"
          else
            echo "primera vez: uso la semilla del repo"
            cp channel/seed.json state.json
          fi
          # Plan de shorts (para contar cuantos hay subidos/publicos), si existe.
          npx --yes wrangler@4 r2 object get "$BUCKET/shorts/0001-youtube-money/plan.json" --file=shorts_plan.json --remote 2>/dev/null || echo "sin shorts aun"

      - name: Generar el reporte (metricas + monetizacion)
        run: node pipeline/channel_report.mjs state.json state_new.json report.txt

      - name: (Pivote Historia) NO rellenar cola de largos — el canal produce Shorts aparte
        run: cp state_new.json state_final.json

      - name: Aprender de los errores (identificar → analizar → registrar → patrones)
        run: |
          npx --yes wrangler@4 r2 object get "$BUCKET/channel/error_log.json" --file=error_log.json --remote 2>/dev/null || echo '{"incidents":[],"patterns":[]}' > error_log.json
          node pipeline/error_learn.mjs error_log.json error_log_new.json || cp error_log.json error_log_new.json
          npx --yes wrangler@4 r2 object put "$BUCKET/channel/error_log.json" --file=error_log_new.json --remote --content-type application/json
          if [ -f error_new.txt ]; then
            bash pipeline/notify_telegram.sh "🛠️ Analicé errores nuevos (los verás en la app · Canal):"$'\n\n'"$(cat error_new.txt)"
          fi

      - name: Validar las herramientas diarias (APIs gratis)
        run: |
          node pipeline/tools_health.mjs tools_health.json || echo '{"tools":[]}' > tools_health.json
          npx --yes wrangler@4 r2 object put "$BUCKET/channel/tools_health.json" --file=tools_health.json --remote --content-type application/json
          if [ -f tools_down.txt ]; then
            bash pipeline/notify_telegram.sh "⚠️ Herramientas con problema (revísalo en la app · Canal):"$'\n\n'"$(cat tools_down.txt)"
          fi

      - name: Guardar el estado actualizado en R2
        run: |
          npx --yes wrangler@4 r2 object put "$BUCKET/channel/state.json" --file=state_final.json --remote
          # Mejores horas por datos (si el reporte las calculó) -> para el agendado del Worker.
          [ -s best_hours.json ] && npx --yes wrangler@4 r2 object put "$BUCKET/channel/best_hours.json" --file=best_hours.json --remote --content-type application/json || true
          # Snapshot diario de MONETIZACION (meta): subs + horas vistas. No depende de abrir la app.
          npx --yes wrangler@4 r2 object get "$BUCKET/channel/monetization_history.json" --file=mh.json --remote 2>/dev/null || echo '[]' > mh.json
          node -e '
            const fs=require("fs"); let h=[]; try{h=JSON.parse(fs.readFileSync("mh.json","utf8"))}catch(e){}; if(!Array.isArray(h))h=[];
            let st={}; try{st=JSON.parse(fs.readFileSync("state_final.json","utf8"))}catch(e){}
            const m=st.monetization||{}, cs=st.channel_stats||{};
            const today=new Date().toISOString().slice(0,10);
            const snap={date:today, subs:Math.round(m.subs||cs.subs||0), watch_hours:Math.round(m.watch_hours||0)};
            if(h.length&&h[h.length-1].date===today) h[h.length-1]=snap; else h.push(snap);
            fs.writeFileSync("mh.json", JSON.stringify(h.slice(-120)));
            console.log("Snapshot Data Lens (meta):", JSON.stringify(snap));
          '
          npx --yes wrangler@4 r2 object put "$BUCKET/channel/monetization_history.json" --file=mh.json --remote --content-type application/json

      - name: Enviar el reporte al chat
        if: always()
        run: |
          if [ -f report.txt ]; then
            bash pipeline/notify_telegram.sh "$(cat report.txt)"
          else
            bash pipeline/notify_telegram.sh "❌ No pude armar el reporte del canal (revisa el log)."
          fi
