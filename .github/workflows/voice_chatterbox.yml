name: Voiceover (Chatterbox - humano)

# Voz mas humana con Chatterbox (Resemble AI, MIT, gratis). Por defecto genera una
# MUESTRA corta (sample.txt) para comparar contra Kokoro. Cambia 'text' a la
# narracion completa cuando la voz este aprobada.

on:
  workflow_dispatch:
    inputs:
      text:
        description: "Archivo de texto a narrar"
        required: false
        default: "projects/0001-youtube-money/sample.txt"
      exaggeration:
        description: "Expresividad (0.4 sobrio - 0.8 dramatico)"
        required: false
        default: "0.6"
      cfg:
        description: "Pacing (0.3 natural - 0.6 firme)"
        required: false
        default: "0.3"
  push:
    branches: [main]
    paths:
      - "pipeline/tts_chatterbox.py"
      - ".github/workflows/voice_chatterbox.yml"

permissions:
  contents: read

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TEXT: ${{ github.event.inputs.text || 'projects/0001-youtube-money/sample.txt' }}
      CB_EXAGGERATION: ${{ github.event.inputs.exaggeration || '0.6' }}
      CB_CFG: ${{ github.event.inputs.cfg || '0.3' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Chatterbox (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install chatterbox-tts soundfile numpy

      - name: Synthesize (Chatterbox)
        run: |
          mkdir -p renders
          python pipeline/tts_chatterbox.py "$TEXT" renders/voiceover_cb_raw.wav

      - name: Normalize -14 LUFS + MP3
        run: |
          ffmpeg -y -i renders/voiceover_cb_raw.wav \
            -af "highpass=f=80,loudnorm=I=-14:TP=-1.5:LRA=11" \
            -ar 48000 renders/voiceover_cb.wav
          ffmpeg -y -i renders/voiceover_cb.wav -codec:a libmp3lame -q:a 2 renders/voiceover_cb.mp3
          ls -la renders/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: voiceover-chatterbox
          path: renders/voiceover_cb.mp3
          if-no-files-found: error
          retention-days: 14
