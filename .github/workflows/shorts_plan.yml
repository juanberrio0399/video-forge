name: Shorts — analisis IA (sugiere cuantos y cuales)

# La IA analiza el video y sugiere los Shorts (cuantos, momentos, largo, hashtags).
# Manda cada short al chat con botones Aprobar/Saltar. Juan aprueba uno por uno.
# No genera nada aqui: solo propone el plan (se guarda en R2).

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "ID del video del que son los shorts (para no re-sugerir)"
        required: false
        default: ""
      notes:
        description: "Comentarios de Juan para mejorar las sugerencias (opcional)"
        required: false
        default: ""

permissions:
  contents: read

env:
  BUCKET: video-forge
  PROJECT: "0001-youtube-money"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Avisar arranque
        run: bash pipeline/notify_telegram.sh "🎬 Analizando el video para sugerir Shorts (cuántos, de qué momentos y qué tan largos). Ya te muestro las propuestas."

      - name: Bajar tiempos + guion ACTIVO de R2
        run: |
          npx --yes wrangler@4 r2 object get "$BUCKET/audio/$PROJECT/timing.json" --file=timing.json --remote || echo "sin timing"
          # Guion del video REALMENTE producido (de R2); si no, el del repo.
          npx --yes wrangler@4 r2 object get "$BUCKET/audio/$PROJECT/voicemap_full.json" --file=voicemap_active.json --remote 2>/dev/null && echo "guion de R2" || cp "projects/$PROJECT/voicemap_full.json" voicemap_active.json

      - name: Analizar y proponer los shorts
        env:
          SHORTS_NOTES: ${{ github.event.inputs.notes }}
        run: node pipeline/shorts_plan.mjs voicemap_active.json timing.json plan.json

      - name: Estampar de qué video es el plan
        env:
          FOR_VIDEO_ID: ${{ github.event.inputs.video_id }}
        run: |
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("plan.json","utf8"));p.for_video_id=process.env.FOR_VIDEO_ID||"";fs.writeFileSync("plan.json",JSON.stringify(p,null,2));console.log("plan.for_video_id =",p.for_video_id||"(vacío)")'

      - name: Guardar el plan en R2
        run: npx --yes wrangler@4 r2 object put "$BUCKET/shorts/$PROJECT/plan.json" --file=plan.json --remote --content-type application/json

      - name: Avisar propuesta de shorts (aprobar en la app)
        run: |
          REASON=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('plan.json','utf8')).reasoning||'')")
          N=$(node -e "process.stdout.write(String(JSON.parse(require('fs').readFileSync('plan.json','utf8')).shorts.length))")
          bash pipeline/notify_telegram.sh "🎬 Propuesta de Shorts — la IA sugiere $N. $REASON"$'\n\n'"👉 Míralos y apruébalos en la app (pestaña Shorts): ahí ves cada uno (título, corte, gancho) y le das ✅ Aprobar — todo desde la app. Luego se generan y suben (9:16, con subtítulos)."
