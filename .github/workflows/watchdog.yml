name: Watchdog de infraestructura (R2 + YouTube)

# Vigila lo CRÍTICO: acceso a R2 (almacenamiento) y los tokens de YouTube de los 2 canales.
# Si algo se rompe, publicar/agendar cae en silencio -> este chequeo lo detecta y avisa a Telegram.
# Corre solo cada día y AVISA solo si hay un fallo (cero spam). El disparo manual siempre reporta.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 11 * * *"   # 1/día, 6am Bogotá

permissions:
  contents: read

env:
  BUCKET: video-forge

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YT2_CLIENT_ID: ${{ secrets.YT2_CLIENT_ID }}
      YT2_CLIENT_SECRET: ${{ secrets.YT2_CLIENT_SECRET }}
      YT2_REFRESH_TOKEN: ${{ secrets.YT2_REFRESH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Vigilar R2 + YouTube (2 canales) + consolidar
        run: node pipeline/watchdog.mjs | tee wd.txt
      - name: Avisar a Telegram (manual siempre; cron solo si hay fallo)
        if: always()
        run: |
          FAILS=$(cat wd_fail.txt 2>/dev/null || echo 0)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            bash pipeline/notify_telegram.sh "🩺 Watchdog infraestructura:"$'\n'"$(cat wd_report.txt)"
          elif [ "$FAILS" -gt 0 ]; then
            bash pipeline/notify_telegram.sh "🚨 WATCHDOG: problema de infraestructura ($FAILS)."$'\n'"$(cat wd_report.txt)"$'\n'"Publicar/agendar puede estar caído — revísalo."
          else
            echo "Watchdog OK, sin aviso."
          fi
