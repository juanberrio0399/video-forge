name: Watchdog de infraestructura (R2 + YouTube + crons)

# Vigila lo CRÍTICO: acceso a R2 (almacenamiento), tokens de YouTube de los 2 canales, y que los
# CRONS DE PRODUCCIÓN sigan vivos (desactivados por GitHub, atrasados o con fallas repetidas).
# Si algo se rompe, publicar/agendar/producir cae en silencio -> esto lo detecta y avisa a Telegram.
# Corre solo cada día y AVISA solo si hay un fallo (cero spam). El disparo manual siempre reporta.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 11 * * *"   # 1/día, 6am Bogotá

permissions:
  contents: read
  actions: read   # para leer el estado/últimos runs de los workflows de producción

env:
  BUCKET: video-forge

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YT2_CLIENT_ID: ${{ secrets.YT2_CLIENT_ID }}
      YT2_CLIENT_SECRET: ${{ secrets.YT2_CLIENT_SECRET }}
      YT2_REFRESH_TOKEN: ${{ secrets.YT2_REFRESH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
      GH_TOKEN: ${{ github.token }}   # token de Actions (actions:read) para vigilar los crons
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Vigilar R2 + YouTube (2 canales)
        run: node pipeline/watchdog.mjs | tee wd.txt
      - name: Vigilar crons de producción
        if: always()
        run: node pipeline/watchdog_workflows.mjs | tee wf.txt
      - name: Avisar a Telegram (manual siempre; cron solo si hay fallo)
        if: always()
        run: |
          F1=$(cat wd_fail.txt 2>/dev/null || echo 0)
          F2=$(cat wf_fail.txt 2>/dev/null || echo 0)
          TOTAL=$((F1 + F2))
          BODY="$(cat wd_report.txt 2>/dev/null)"$'\n'"$(cat wf_report.txt 2>/dev/null)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            bash pipeline/notify_telegram.sh "🩺 Watchdog (infra + crons):"$'\n'"$BODY"
          elif [ "$TOTAL" -gt 0 ]; then
            bash pipeline/notify_telegram.sh "🚨 WATCHDOG: $TOTAL problema(s) detectado(s)."$'\n'"$BODY"$'\n'"Algo puede estar caído — revísalo."
          else
            echo "Watchdog OK ($TOTAL problemas), sin aviso."
          fi
