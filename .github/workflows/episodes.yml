name: Memoria episódica + Score por video -> R2

# Brain OS Fase 2 + Growth Fase 2: construye un "episodio" por video (hechos + rendimiento
# relativo al baseline del canal) desde el inventario en R2, y con eso PUNTÚA cada video
# (score 0-100 + veredicto SCALE/ITERATE/TEST_AGAIN/STOP) y detecta OUTLIERS propios.

on:
  schedule:
    - cron: "0 14 * * *"   # diario 14:00 UTC (tras weekly_stats/baseline y el Cerebro)
  workflow_dispatch: {}

permissions:
  contents: read

env:
  BUCKET: video-forge

jobs:
  episodes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Construir episodios de ambos canales
        run: |
          npx --yes wrangler@4 r2 object get "$BUCKET/channel/inventory_cache.json" --file=inv_dl.json --remote 2>/dev/null || echo '{}' > inv_dl.json
          npx --yes wrangler@4 r2 object get "$BUCKET/channel/auto2/state.json" --file=inv_od.json --remote 2>/dev/null || echo '{}' > inv_od.json
          node pipeline/episodes.mjs inv_dl.json episodes.json
          node pipeline/episodes.mjs inv_od.json episodes_auto2.json
          [ -s episodes.json ] && npx --yes wrangler@4 r2 object put "$BUCKET/channel/episodes.json" --file=episodes.json --remote --content-type application/json || true
          [ -s episodes_auto2.json ] && npx --yes wrangler@4 r2 object put "$BUCKET/channel/auto2/episodes.json" --file=episodes_auto2.json --remote --content-type application/json || true
      - name: Score por video + outliers (Growth Fase 2)
        run: |
          # Retención (si existe) para enriquecer el score; si falta, el score usa solo rendimiento+engagement.
          npx --yes wrangler@4 r2 object get "$BUCKET/channel/retention.json" --file=ret_dl.json --remote 2>/dev/null || echo '{}' > ret_dl.json
          npx --yes wrangler@4 r2 object get "$BUCKET/channel/auto2/retention.json" --file=ret_od.json --remote 2>/dev/null || echo '{}' > ret_od.json
          node pipeline/video_scores.mjs episodes.json ret_dl.json scores.json || true
          node pipeline/video_scores.mjs episodes_auto2.json ret_od.json scores_auto2.json || true
          [ -s scores.json ] && npx --yes wrangler@4 r2 object put "$BUCKET/channel/scores.json" --file=scores.json --remote --content-type application/json || true
          [ -s scores_auto2.json ] && npx --yes wrangler@4 r2 object put "$BUCKET/channel/auto2/scores.json" --file=scores_auto2.json --remote --content-type application/json || true
      - name: A/B por cohortes (hook) — Growth Fase 3
        run: |
          # A/B de UNA variable (hook) por cohortes sobre los videos ya scoreados. Solo medición.
          node pipeline/ab_tests.mjs scores.json ab.json || true
          node pipeline/ab_tests.mjs scores_auto2.json ab_auto2.json || true
          [ -s ab.json ] && npx --yes wrangler@4 r2 object put "$BUCKET/channel/ab_tests.json" --file=ab.json --remote --content-type application/json || true
          [ -s ab_auto2.json ] && npx --yes wrangler@4 r2 object put "$BUCKET/channel/auto2/ab_tests.json" --file=ab_auto2.json --remote --content-type application/json || true
