name: Growth Radar (inteligencia de crecimiento YouTube)

# Cada domingo investiga inteligencia de crecimiento para los 2 canales (tendencias, competencia,
# OUTLIERS, algoritmo/politicas, requisitos YPP) con Gemini + busqueda web, clasifica por evidencia
# y propone experimentos. Corre ANTES del optimizador del lunes para informar la semana.
# Te manda el informe a Telegram + lo guarda en R2 para la Mini App. Todo en tu infra.
on:
  schedule:
    - cron: "0 13 * * 0"   # domingo 13:00 UTC = 8:00 a.m. Bogota
  workflow_dispatch: {}

permissions:
  contents: read

env:
  BUCKET: video-forge

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Investigar (Growth Radar)
        run: node pipeline/growth_radar.mjs

      - name: Guardar en R2 (para la Mini App)
        run: npx --yes wrangler@4 r2 object put "$BUCKET/channel/growth_radar.json" --file=growth_radar.json --content-type application/json --remote

      - name: Enviar el informe a Telegram
        run: bash pipeline/notify_telegram.sh "$(cat growth_radar.txt)"
