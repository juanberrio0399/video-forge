name: Radar — consolidar backlog (groomer)

# Capa 2 del cerebro del radar: mantiene el backlog LIMPIO y MEJORÁNDOSE. En vez de acumular issues,
# consolida los `radar` abiertos que están relacionados en UNO mejor (actualiza + cierra los redundantes).
# Corre unos días después del barrido (así integra lo que se acumuló). Usa la cadena de IA gratis.

on:
  schedule:
    - cron: "0 13 * * 4"   # jueves 13:00 UTC (el barrido corre lunes; esto consolida 3 días después)
  workflow_dispatch:
    inputs:
      repo:
        description: "owner/repo objetivo (vacío = todos)"
        required: false
        default: ""

concurrency:
  group: radar-groom-${{ github.event.inputs.repo || 'weekly' }}

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.set.outputs.repos }}
    steps:
      - id: set
        run: |
          if [ -n "${{ github.event.inputs.repo }}" ]; then
            echo 'repos=["${{ github.event.inputs.repo }}"]' >> "$GITHUB_OUTPUT"
          else
            echo 'repos=["juanberrio0399/video-forge","juanberrio0399/serverless-rag-assistant","juanberrio0399/panel-marketing-cloud","juanberrio0399/dataforge-cloud","juanberrio0399/validador-cloud","juanberrio0399/ugpp-shield-pro","juanberrio0399/Hearthwood","juanberrio0399/claude-config","juanberrio0399/dockerized-data-tool","juanberrio0399/aws-labs","juanberrio0399/juanberrio0399.github.io"]' >> "$GITHUB_OUTPUT"
          fi

  groom:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        repo: ${{ fromJSON(needs.prepare.outputs.repos) }}
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      TARGET: ${{ matrix.repo }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Consolidar el backlog del radar
        run: node pipeline/radar_groom.mjs
