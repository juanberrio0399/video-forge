name: Clipear short CC-BY (YouTube Creative Commons -> Oddly Loop)

# Toma un video RECIENTE con licencia Creative Commons (CC-BY) de YouTube (verifica la licencia
# por API), la IA elige el mejor momento y arma un SHORT 9:16 con NUESTRO audio + ATRIBUCIÓN.
# Sube a Oddly Loop (YT2) privado para revisar. Descarga con yt-dlp (YouTube puede bloquear desde
# la nube -> si falla seguido, pivotamos a Vimeo CC / Archive.org / NASA).

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Tema a buscar en CC-BY (ej: funny animals, science experiment, skateboard)"
        default: "funny animals"
      niche:
        description: "categoría (graciosos / ciencia_humor / deporte_momentos)"
        default: "graciosos"
      publish:
        description: "no = privado · yes = programa"
        default: "no"

permissions:
  contents: read

env:
  BUCKET: video-forge

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      YT_CLIENT_ID: ${{ secrets.YT2_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT2_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT2_REFRESH_TOKEN }}
      YT_CATEGORY_ID: "24"
      CHANNEL_URL: "https://youtube.com/@oddlyloophq"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
      TOPIC: ${{ github.event.inputs.topic || 'funny animals' }}
      NICHE: ${{ github.event.inputs.niche || 'graciosos' }}
      PUBLISH: ${{ github.event.inputs.publish || 'no' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar ffmpeg + yt-dlp
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-liberation
          sudo curl -fL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp && sudo chmod a+rx /usr/local/bin/yt-dlp
          yt-dlp --version
      - name: Música de fondo (opcional)
        run: npx --yes wrangler@4 r2 object get "$BUCKET/music/cinematic.mp3" --file=music.mp3 --remote 2>/dev/null || echo "sin musica"
      - name: Clipear el mejor momento CC-BY -> short 9:16
        run: |
          set +e
          node pipeline/clip_cc_short.mjs "$TOPIC" "$NICHE" short.mp4; RC=$?
          if [ "$RC" = "2" ]; then bash pipeline/notify_telegram.sh "⚠️ Clip CC: YouTube bloqueó la descarga desde la nube (tema: ${TOPIC}). Reintento luego o pivotamos a Vimeo/Archive/NASA." || true; exit 1; fi
          [ "$RC" != "0" ] && exit 1 || true
      - name: PUERTA de compliance (CC-BY con atribución)
        run: |
          if node pipeline/compliance_check.mjs clip_manifest.json channel/auto2/sources.seed.json; then echo "ok"; else
            bash pipeline/notify_telegram.sh "🚫 Clip CC rechazado:"$'\n'"$(cat compliance_fail.txt 2>/dev/null)" || true; exit 1; fi
      - name: Subir a Oddly Loop (PRIVADO) + niche_map + (programar)
        run: |
          node pipeline/youtube_upload.mjs short.mp4 publish/package.json
          [ ! -f publish/video_id.txt ] && { bash pipeline/notify_telegram.sh "❌ Clip CC: falló la subida." || true; exit 1; }
          VID=$(cat publish/video_id.txt)
          npx --yes wrangler@4 r2 object get "$BUCKET/channel/auto2/niche_map.json" --file=nm.json --remote 2>/dev/null || echo '{}' > nm.json
          VID="$VID" NICHE="$NICHE" node -e 'const fs=require("fs");let m={};try{m=JSON.parse(fs.readFileSync("nm.json","utf8"))}catch(e){};m[process.env.VID]=process.env.NICHE;fs.writeFileSync("nm.json",JSON.stringify(m))'
          npx --yes wrangler@4 r2 object put "$BUCKET/channel/auto2/niche_map.json" --file=nm.json --remote --content-type application/json || true
          if [ "$PUBLISH" = "yes" ]; then
            npx --yes wrangler@4 r2 object get "$BUCKET/channel/auto2/best_hours.json" --file=best_hours.json --remote 2>/dev/null || true
            OCC=$(node pipeline/scheduled_times.mjs); SLOT=$(node pipeline/best_slot.mjs "$OCC")
            node pipeline/youtube_schedule.mjs "$VID" "$SLOT" || true
            bash pipeline/notify_telegram.sh "🎬 Clip CC-BY (${NICHE}) subido y PROGRAMADO ($SLOT). $(cat publish/youtube_result.txt 2>/dev/null | head -2)"
          else
            bash pipeline/notify_telegram.sh "🎬 Clip CC-BY (${NICHE}) — PRIVADO para revisar 👀. Con crédito al autor (CC-BY):"$'\n'"$(cat publish/youtube_result.txt 2>/dev/null | head -2)"
          fi
