name: Voiceover PARALELO (Chatterbox rapido)

# Genera la narracion dirigida MUCHO mas rapido: parte el guion en 6 pedazos que
# se sintetizan EN PARALELO y luego se unen. ~15 min en vez de +90 min.

on:
  workflow_dispatch:
    inputs:
      map:
        description: "Mapa de voz (JSON por beat)"
        required: false
        default: "projects/0001-youtube-money/voicemap_full.json"
      then_render:
        description: "Al terminar, disparar el render (parte de la fabrica)"
        required: false
        default: "false"
      engine:
        description: "Motor de voz: auto | gemini | kokoro"
        required: false
        default: "auto"

permissions:
  contents: read

env:
  NUM_CHUNKS: "6"

jobs:
  decide:
    name: Elegir motor y voz
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      engine: ${{ steps.e.outputs.engine }}
      kvoice: ${{ steps.e.outputs.kvoice }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Decidir segun la voz elegida (o auto con respaldo Kokoro)
        id: e
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
          VOICE: Charon
        run: |
          npx --yes wrangler@4 r2 object get "video-forge/channel/voice_choice.json" --file=vc.json --remote 2>/dev/null || echo '{}' > vc.json
          CH_ENGINE=$(node -e 'try{process.stdout.write(JSON.parse(require("fs").readFileSync("vc.json","utf8")).engine||"")}catch(e){}')
          CH_KVOICE=$(node -e 'try{process.stdout.write(JSON.parse(require("fs").readFileSync("vc.json","utf8")).kvoice||"")}catch(e){}')
          KVOICE="${CH_KVOICE:-am_michael}"
          IN="${{ github.event.inputs.engine }}"
          if [ "$IN" = "gemini" ] || [ "$IN" = "kokoro" ]; then
            ENGINE="$IN"; echo "motor FORZADO por input: $ENGINE"
          elif [ "$CH_ENGINE" = "kokoro" ]; then
            ENGINE="kokoro"; echo "voz elegida: Kokoro $KVOICE"
          else
            ENGINE=$(node pipeline/tts_health.mjs); echo "voz elegida: Gemini (o auto) -> $ENGINE"
          fi
          echo "engine=$ENGINE" >> "$GITHUB_OUTPUT"
          echo "kvoice=$KVOICE" >> "$GITHUB_OUTPUT"

  synth:
    name: Pedazo ${{ matrix.chunk }}
    needs: decide
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        chunk: [0, 1, 2, 3, 4, 5]
    env:
      ENGINE: ${{ needs.decide.outputs.engine }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Bajar el guion ACTIVO de R2 (fabrica) o el del repo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 r2 object get "video-forge/audio/0001-youtube-money/voicemap_full.json" --file=voicemap_active.json --remote 2>/dev/null && echo "guion de R2" || cp "${{ github.event.inputs.map || 'projects/0001-youtube-money/voicemap_full.json' }}" voicemap_active.json
      - name: (Respaldo) Instalar Kokoro + modelos si toca
        if: ${{ needs.decide.outputs.engine == 'kokoro' }}
        run: |
          sudo apt-get install -y espeak-ng
          pip install --quiet kokoro-onnx soundfile numpy
          curl -sL -o kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -sL -o voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - name: Sintetizar pedazo (Gemini locutor o Kokoro de respaldo)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
          VOICE: Charon
          KVOICE: ${{ needs.decide.outputs.kvoice || 'am_michael' }}
        run: |
          mkdir -p out
          if [ "$ENGINE" = "kokoro" ]; then
            echo "Sintetizando con KOKORO (respaldo)"
            python pipeline/tts_kokoro.py voicemap_active.json "out/part_${{ matrix.chunk }}.wav" ${{ matrix.chunk }} ${NUM_CHUNKS}
          else
            echo "Sintetizando con GEMINI (locutor Charon)"
            node pipeline/tts_gemini_directed.mjs voicemap_active.json "out/part_${{ matrix.chunk }}.wav" ${{ matrix.chunk }} ${NUM_CHUNKS}
          fi
      - name: Subir pedazo (audio + tiempos)
        uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.chunk }}
          path: out/part_${{ matrix.chunk }}.wav*
          if-no-files-found: error
          retention-days: 1

  combine:
    name: Unir y publicar
    needs: [decide, synth]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUCKET: video-forge
      PROJECT: 0001-youtube-money
      ENGINE: ${{ needs.decide.outputs.engine }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Bajar todos los pedazos
        uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: parts
          merge-multiple: true
      - name: Unir audio en orden + normalizar -14 LUFS + MP3
        run: |
          mkdir -p renders
          : > list.txt
          MISSING=0
          for i in $(seq 0 $((NUM_CHUNKS-1))); do
            f="parts/part_${i}.wav"
            if [ -f "$f" ]; then echo "file '$PWD/$f'" >> list.txt; else echo "FALTA pedazo $i"; MISSING=$((MISSING+1)); fi
          done
          # Si falta cualquier pedazo, NO armar una voz incompleta ni encadenar el render.
          if [ "$MISSING" -gt 0 ]; then
            echo "Faltan $MISSING pedazo(s) de $NUM_CHUNKS -> abortar para no dejar narración a medias."
            exit 1
          fi
          echo "=== orden de union ==="; cat list.txt
          ffmpeg -y -f concat -safe 0 -i list.txt -ar 24000 -ac 1 renders/full_raw.wav
          ffmpeg -y -i renders/full_raw.wav \
            -af "highpass=f=80,loudnorm=I=-14:TP=-1.5:LRA=11" \
            -ar 48000 renders/voiceover_dir.wav
          ffmpeg -y -i renders/voiceover_dir.wav -codec:a libmp3lame -q:a 2 renders/voiceover_dir.mp3
          ls -la renders/
      - name: Construir mapa de tiempos (timing.json)
        run: |
          node -e '
            const fs = require("fs");
            const N = parseInt(process.env.NUM_CHUNKS);
            let beats = [];
            for (let i = 0; i < N; i++) {
              const p = `parts/part_${i}.wav.timing.json`;
              if (fs.existsSync(p)) beats = beats.concat((JSON.parse(fs.readFileSync(p)).beats) || []);
            }
            beats.sort((a, b) => a.index - b.index);
            let t = 0;
            for (const b of beats) { b.start = Math.round(t*1000)/1000; t += b.dur; b.end = Math.round(t*1000)/1000; }
            fs.writeFileSync("renders/timing.json", JSON.stringify({ total: Math.round(t*1000)/1000, beats }, null, 2));
            console.log("timing.json:", beats.length, "beats, total", t.toFixed(1), "s");
            // GUARDA anti-truncamiento: si el TTS fallo la mayoria de beats (silencio), el promedio
            // por beat cae mucho. Cortar ACA para no gastar un render en una voz a medias.
            const avg = beats.length ? t / beats.length : 0;
            if (beats.length >= 20 && avg < 3.0) {
              console.error(`❌ Narración TRUNCADA: ${beats.length} beats pero solo ${t.toFixed(0)}s (promedio ${avg.toFixed(1)}s/beat, muchos beats en silencio). Aborto para no renderizar una voz a medias.`);
              process.exit(1);
            }
          '
          cat renders/timing.json | head -20
      - name: Subir narracion + tiempos (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: voiceover-directed
          path: |
            renders/voiceover_dir.mp3
            renders/timing.json
          if-no-files-found: error
          retention-days: 14
      - name: Guardar en R2 (nube persistente)
        if: ${{ hashFiles('renders/voiceover_dir.mp3') != '' }}
        run: |
          npx --yes wrangler@4 r2 object put "$BUCKET/audio/$PROJECT/voiceover.mp3" --file=renders/voiceover_dir.mp3 --remote
          npx --yes wrangler@4 r2 object put "$BUCKET/audio/$PROJECT/timing.json" --file=renders/timing.json --remote
          echo "R2: audio/$PROJECT/voiceover.mp3 + timing.json"
      - name: Avisar a Telegram + (fabrica) encadenar el RENDER
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          THEN_RENDER: ${{ github.event.inputs.then_render }}
        run: |
          if [ "$ENGINE" = "kokoro" ]; then VOZ="voz Kokoro (respaldo, Gemini estaba saturado)"; else VOZ="locutor Gemini (Charon)"; fi
          if [ -f renders/voiceover_dir.mp3 ]; then
            if [ "$THEN_RENDER" = "true" ]; then
              bash pipeline/notify_telegram.sh "🎙️ Narración lista con $VOZ. Ahora renderizo el video por fases (automatico). Te lo mando para aprobar al terminar." renders/voiceover_dir.mp3
              gh workflow run render_phased.yml -R "$GITHUB_REPOSITORY" && echo "render disparado"
            else
              bash pipeline/notify_telegram.sh "🎙️ Resultado: NARRACIÓN lista con $VOZ, guardada en R2. Si suena bien, dale a 🎬 Renderizar." renders/voiceover_dir.mp3
            fi
          else
            bash pipeline/notify_telegram.sh "❌ La narración falló al unir los pedazos. Vuelve a intentar con 🎙️ Generar voz."
          fi
