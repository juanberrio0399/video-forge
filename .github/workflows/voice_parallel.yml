name: Voiceover PARALELO (Chatterbox rapido)

# Genera la narracion dirigida MUCHO mas rapido: parte el guion en 6 pedazos que
# se sintetizan EN PARALELO y luego se unen. ~15 min en vez de +90 min.

on:
  workflow_dispatch:
    inputs:
      map:
        description: "Mapa de voz (JSON por beat)"
        required: false
        default: "projects/0001-youtube-money/voicemap_full.json"
      then_render:
        description: "Al terminar, disparar el render (parte de la fabrica)"
        required: false
        default: "false"

permissions:
  contents: read

env:
  NUM_CHUNKS: "6"

jobs:
  synth:
    name: Pedazo ${{ matrix.chunk }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        chunk: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - name: Bajar voz de referencia de R2 (privada, no vive en el repo)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p assets/voice
          npx --yes wrangler@4 r2 object get "video-forge/voice/ref_juan_es.mp3" --file=assets/voice/ref_juan_es.mp3 --remote
          ls -la assets/voice/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Chatterbox (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install chatterbox-tts soundfile numpy
      - name: Bajar el guion ACTIVO de R2 (el de la fabrica), si existe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 r2 object get "video-forge/audio/0001-youtube-money/voicemap_full.json" --file=voicemap_active.json --remote 2>/dev/null && echo "usando guion de R2" || echo "sin guion en R2; uso el del repo"
      - name: Sintetizar pedazo
        env:
          MAP_REPO: ${{ github.event.inputs.map || 'projects/0001-youtube-money/voicemap_full.json' }}
        run: |
          mkdir -p out
          # Prefiere el guion activo de R2 (fabrica); si no, el del repo.
          MAP="$MAP_REPO"; [ -s voicemap_active.json ] && MAP="voicemap_active.json"
          echo "MAP=$MAP"
          python pipeline/tts_chatterbox_directed.py "$MAP" "out/part_${{ matrix.chunk }}.wav" ${{ matrix.chunk }} ${NUM_CHUNKS}
      - name: Subir pedazo (audio + tiempos)
        uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.chunk }}
          path: out/part_${{ matrix.chunk }}.wav*
          if-no-files-found: error
          retention-days: 1

  combine:
    name: Unir y publicar
    needs: synth
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUCKET: video-forge
      PROJECT: 0001-youtube-money
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Bajar todos los pedazos
        uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: parts
          merge-multiple: true
      - name: Unir audio en orden + normalizar -14 LUFS + MP3
        run: |
          mkdir -p renders
          : > list.txt
          for i in $(seq 0 $((NUM_CHUNKS-1))); do
            f="parts/part_${i}.wav"
            if [ -f "$f" ]; then echo "file '$PWD/$f'" >> list.txt; fi
          done
          echo "=== orden de union ==="; cat list.txt
          ffmpeg -y -f concat -safe 0 -i list.txt -ar 24000 -ac 1 renders/full_raw.wav
          ffmpeg -y -i renders/full_raw.wav \
            -af "highpass=f=80,loudnorm=I=-14:TP=-1.5:LRA=11" \
            -ar 48000 renders/voiceover_dir.wav
          ffmpeg -y -i renders/voiceover_dir.wav -codec:a libmp3lame -q:a 2 renders/voiceover_dir.mp3
          ls -la renders/
      - name: Construir mapa de tiempos (timing.json)
        run: |
          node -e '
            const fs = require("fs");
            const N = parseInt(process.env.NUM_CHUNKS);
            let beats = [];
            for (let i = 0; i < N; i++) {
              const p = `parts/part_${i}.wav.timing.json`;
              if (fs.existsSync(p)) beats = beats.concat((JSON.parse(fs.readFileSync(p)).beats) || []);
            }
            beats.sort((a, b) => a.index - b.index);
            let t = 0;
            for (const b of beats) { b.start = Math.round(t*1000)/1000; t += b.dur; b.end = Math.round(t*1000)/1000; }
            fs.writeFileSync("renders/timing.json", JSON.stringify({ total: Math.round(t*1000)/1000, beats }, null, 2));
            console.log("timing.json:", beats.length, "beats, total", t.toFixed(1), "s");
          '
          cat renders/timing.json | head -20
      - name: Subir narracion + tiempos (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: voiceover-directed
          path: |
            renders/voiceover_dir.mp3
            renders/timing.json
          if-no-files-found: error
          retention-days: 14
      - name: Guardar en R2 (nube persistente)
        if: ${{ hashFiles('renders/voiceover_dir.mp3') != '' }}
        run: |
          npx --yes wrangler@4 r2 object put "$BUCKET/audio/$PROJECT/voiceover.mp3" --file=renders/voiceover_dir.mp3 --remote
          npx --yes wrangler@4 r2 object put "$BUCKET/audio/$PROJECT/timing.json" --file=renders/timing.json --remote
          echo "R2: audio/$PROJECT/voiceover.mp3 + timing.json"
      - name: Avisar a Telegram + (fabrica) encadenar el RENDER
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          THEN_RENDER: ${{ github.event.inputs.then_render }}
        run: |
          if [ -f renders/voiceover_dir.mp3 ]; then
            if [ "$THEN_RENDER" = "true" ]; then
              bash pipeline/notify_telegram.sh "🎙️ Narración lista. Ahora renderizo el video por fases (automatico). Te lo mando para aprobar al terminar." renders/voiceover_dir.mp3
              gh workflow run render_phased.yml -R "$GITHUB_REPOSITORY" && echo "render disparado"
            else
              bash pipeline/notify_telegram.sh "🎙️ Resultado: NARRACIÓN lista (tu voz), guardada en R2. Es el paso previo al video. Si suena bien, dale a 🎬 Renderizar." renders/voiceover_dir.mp3
            fi
          else
            bash pipeline/notify_telegram.sh "❌ La narración falló al unir los pedazos. Vuelve a intentar con 🎙️ Generar voz."
          fi
