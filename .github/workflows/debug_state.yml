name: DEBUG estado (volcar R2 al log)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      BUCKET: video-forge
      PROJECT: "0001-youtube-money"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Volcar los JSON clave de R2
        run: |
          g(){ npx --yes wrangler@4 r2 object get "$BUCKET/$1" --file="$2" --remote 2>/dev/null && echo "ok" || echo "(no existe)"; }
          g "shorts/$PROJECT/plan.json" plan.json
          g "video/$PROJECT/package.json" package.json
          g "video/$PROJECT/video_id.txt" vid.txt
          g "channel/produced.json" produced.json
          g "video/$PROJECT/seo_approved.json" seoapp.json
          g "channel/inventory_cache.json" inv.json
          node -e '
            const fs=require("fs"); const rd=(p)=>{try{return JSON.parse(fs.readFileSync(p,"utf8"))}catch(e){return null}};
            const plan=rd("plan.json");
            console.log("===== PLAN.json =====");
            console.log("for_video_id:", plan&&plan.for_video_id);
            (plan&&plan.shorts||[]).forEach(s=>console.log(`  n=${s.n} approved=${s.approved} skipped=${s.skipped} video_id=${s.video_id||"-"} | ${s.title}`));
            const pkg=rd("package.json"); console.log("===== PACKAGE.json ====="); console.log("  title:", pkg&&pkg.title, "| nota:", pkg&&pkg.validation&&pkg.validation.nota_global);
            console.log("===== video_id.txt =====", fs.existsSync("vid.txt")?fs.readFileSync("vid.txt","utf8").trim():"-");
            const seo=rd("seoapp.json"); console.log("===== seo_approved ====="); console.log("  approved:", seo&&seo.approved, "| title:", seo&&seo.title);
            const inv=rd("inv.json"); console.log("===== INVENTORY ====="); if(inv){console.log("  longs:",(inv.longs||[]).map(v=>v.video_id+"/"+v.privacy).join(", "));console.log("  shorts:",(inv.shorts||[]).map(v=>v.video_id+"/"+v.privacy).join(", "));}
          '