name: Reporte del canal auto (Oddly Loop / YT2)

# Trae el estado real de Oddly Loop (videos, subs, vistas, minutos) y lo guarda en R2
# para que la app muestre el canal Auto #2. Cron cada 2h + disparo manual/app.

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  BUCKET: video-forge

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      YT2_CLIENT_ID: ${{ secrets.YT2_CLIENT_ID }}
      YT2_CLIENT_SECRET: ${{ secrets.YT2_CLIENT_SECRET }}
      YT2_REFRESH_TOKEN: ${{ secrets.YT2_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Estado de Oddly Loop
        run: |
          npx --yes wrangler@4 r2 object get "$BUCKET/channel/auto2/niche_map.json" --file=niche_map.json --remote 2>/dev/null || echo '{}' > niche_map.json
          node pipeline/report_auto2.mjs
          npx --yes wrangler@4 r2 object put "$BUCKET/channel/auto2/state.json" --file=auto2_state.json --remote --content-type application/json
          # Mejores horas por datos (si el reporte las calculó) -> para el agendado.
          [ -s best_hours.json ] && npx --yes wrangler@4 r2 object put "$BUCKET/channel/auto2/best_hours.json" --file=best_hours.json --remote --content-type application/json || true
          # Snapshot diario de MONETIZACION (meta): subs + vistas de Shorts. No depende de abrir la app.
          npx --yes wrangler@4 r2 object get "$BUCKET/channel/auto2/monetization_history.json" --file=mh2.json --remote 2>/dev/null || echo '[]' > mh2.json
          node -e '
            const fs=require("fs"); let h=[]; try{h=JSON.parse(fs.readFileSync("mh2.json","utf8"))}catch(e){}; if(!Array.isArray(h))h=[];
            let st={}; try{st=JSON.parse(fs.readFileSync("auto2_state.json","utf8"))}catch(e){}
            const today=new Date().toISOString().slice(0,10);
            const snap={date:today, subs:Math.round(st.subs||0), shorts_views:Math.round(st.total_views||0)};
            if(h.length&&h[h.length-1].date===today) h[h.length-1]=snap; else h.push(snap);
            fs.writeFileSync("mh2.json", JSON.stringify(h.slice(-120)));
            console.log("Snapshot Oddly (meta):", JSON.stringify(snap));
          '
          npx --yes wrangler@4 r2 object put "$BUCKET/channel/auto2/monetization_history.json" --file=mh2.json --remote --content-type application/json
