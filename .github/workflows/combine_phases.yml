name: Unir FASES ya renderizadas (rescate, sin re-renderizar)

# Rescata un render por fases cuyo job "combine" fallo: baja los artifacts phase-out-*
# de un run anterior (que ya tienen el video de cada fase) y los une SIN volver a
# renderizar (que tarda horas). Uso: dispara con el run_id del render por fases.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID del run de render_phased cuyas fases hay que unir"
        required: true

permissions:
  contents: read
  actions: read

env:
  BUCKET: video-forge
  PROJECT: "0001-youtube-money"

jobs:
  combine:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Bajar las fases del run anterior
        uses: actions/download-artifact@v4
        with:
          pattern: phase-out-*
          path: outs
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Unir en orden + comprimir + guardar en R2
        run: |
          echo "=== artifacts bajados ==="; find outs -type f | head -40
          node -e '
            const fs=require("fs");
            // Descubre las fases por las carpetas phase-out-<k> y ordena por numero.
            const dirs=fs.readdirSync("outs").filter(d=>/^phase-out-\d+$/.test(d));
            const ks=dirs.map(d=>parseInt(d.replace("phase-out-",""),10)).sort((a,b)=>a-b);
            const lines=[]; const scores=[]; let min=99, missing=[];
            for(const k of ks){
              const f=`outs/phase-out-${k}/renders/video.mp4`;
              let s=parseFloat((()=>{try{return fs.readFileSync(`outs/phase-out-${k}/renders/score.txt`,"utf8").trim()}catch(e){return ""}})());
              if(!isFinite(s)) s=0;
              scores.push(`f${k}:${s}`);
              if(fs.existsSync(f)){ lines.push(`file ${process.cwd()}/${f}`); if(s<min) min=s; }
              else missing.push(k);
            }
            fs.writeFileSync("list.txt", lines.join("\n")+"\n");
            fs.appendFileSync(process.env.GITHUB_ENV, `MIN_SCORE=${min===99?0:min}\n`);
            fs.appendFileSync(process.env.GITHUB_ENV, `SCORES=${scores.join(" ")}\n`);
            if(missing.length) console.log("OJO faltan fases:", missing.join(","));
            console.log("orden de union:\n"+lines.join("\n"));
            if(!lines.length){ console.error("Sin fases para unir"); process.exit(1); }
          '
          ffmpeg -y -f concat -safe 0 -i list.txt -c:v libx264 -crf 23 -preset medium -pix_fmt yuv420p -c:a aac -b:a 128k renders_video.mp4
          ls -la renders_video.mp4
          npx --yes wrangler@4 r2 object put "$BUCKET/video/$PROJECT/video.mp4" --file=renders_video.mp4 --remote
          echo "R2: video/$PROJECT/video.mp4 (unido de las fases del run ${{ github.event.inputs.run_id }})"

      - name: Enviar al chat con aprobacion
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
        run: |
          if [ -f renders_video.mp4 ]; then
            MK='{"inline_keyboard":[[{"text":"✅ Aprobar y publicar","callback_data":"approve:video"},{"text":"🔁 Regenerar","callback_data":"regen:phased"}],[{"text":"✏️ Cambiar algo","callback_data":"change:video"}]]}'
            MSG="🎬 Resultado: VIDEO completo del canal (unido por fases)."$'\n'"Notas por fase:${SCORES} · mínima ${MIN_SCORE}/10."$'\n\n'
            if node -e "process.exit((${MIN_SCORE:-0}) >= 7.5 ? 0 : 1)"; then
              MSG="${MSG}✅ Todas las fases pasaron el mínimo (7.5). ¿Lo apruebo y publico (privado) o lo regeneramos?"
            else
              MSG="${MSG}⚠️ Quedó por debajo del mínimo (7.5). Recomiendo REGENERARLO. Si aun así lo quieres publicar, aprébalo."
            fi
            bash pipeline/notify_telegram.sh "$MSG" renders_video.mp4 "$MK"
          else
            bash pipeline/notify_telegram.sh "❌ No pude unir las fases (rescate). Toca 🔁 Regenerar para rehacer el video."
          fi
