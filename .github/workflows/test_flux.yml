name: Probar Flux (gen_image)

# Diagnóstico manual: corre gen_image con un prompt de TEXTO/REALISMO (que prioriza Flux)
# y muestra en el log si usó Flux.1-schnell (HuggingFace) o cayó a Gemini/Pollinations.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: gen_image con prompt de texto/realismo (dispara Flux)
        run: |
          echo "HF_TOKEN presente: $([ -n \"$HF_TOKEN\" ] && echo SI || echo NO)"
          node pipeline/gen_image.mjs "a photorealistic advertising poster with bold text SALE 50 percent, studio lighting, 8k, highly detailed" flux_test.png
      - name: Verificar la imagen
        run: |
          ls -la flux_test.png
          echo "tipo: $(file flux_test.png)"
          echo "bytes: $(stat -c%s flux_test.png)"
