name: Shorts — generar y subir los aprobados

# Genera los Shorts que Juan aprobo (9:16, con titulo y handle) y los sube a YouTube
# como PRIVADOS. Lee el plan de R2 (con los aprobados) y el video final. Luego manda
# cada short al chat con su link + boton Publicar (Juan aprueba uno por uno).

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUCKET: video-forge
  PROJECT: "0001-youtube-money"

jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: FFmpeg + fuentes
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core

      - name: Avisar arranque
        run: bash pipeline/notify_telegram.sh "🎬 Generando los Shorts aprobados (9:16). Cuando esten, te mando cada uno con su link para revisarlo y aprobarlo."

      - name: Bajar plan (aprobados) + video de R2
        run: |
          npx --yes wrangler@4 r2 object get "$BUCKET/shorts/$PROJECT/plan.json" --file=plan.json --remote
          npx --yes wrangler@4 r2 object get "$BUCKET/video/$PROJECT/video.mp4" --file=video.mp4 --remote
          ls -la plan.json video.mp4

      - name: Generar y subir los shorts aprobados
        run: node pipeline/shorts_generate.mjs plan.json video.mp4 plan_new.json

      - name: Guardar el plan actualizado en R2
        if: always()
        run: npx --yes wrangler@4 r2 object put "$BUCKET/shorts/$PROJECT/plan.json" --file=plan_new.json --remote || true

      - name: Enviar cada short con su link + boton Publicar
        if: always()
        run: |
          if [ -f shorts_result.txt ]; then bash pipeline/notify_telegram.sh "$(cat shorts_result.txt)"; fi
          if [ -f shorts_uploaded.json ]; then
            COUNT=$(node -e "process.stdout.write(String(JSON.parse(require('fs').readFileSync('shorts_uploaded.json','utf8')).length))")
            i=0
            while [ "$i" -lt "$COUNT" ]; do
              MSG=$(IDX=$i node -e 'const d=JSON.parse(require("fs").readFileSync("shorts_uploaded.json","utf8"))[+process.env.IDX];process.stdout.write("🎬 Short #"+(d.n+1)+": "+d.title+"\n▶️ Mira el short (privado): "+d.url+"\n\n¿Lo apruebo y lo dejo PUBLICO?")')
              MK=$(IDX=$i node -e 'const d=JSON.parse(require("fs").readFileSync("shorts_uploaded.json","utf8"))[+process.env.IDX];process.stdout.write(JSON.stringify({inline_keyboard:[[{text:"▶️ Ver el short",url:d.url}],[{text:"✅ Publicar",callback_data:"short_pub:"+d.video_id},{text:"⏸️ Dejar privado",callback_data:"short_keep:"+d.video_id}]]}))')
              bash pipeline/notify_telegram.sh "$MSG" "" "$MK"
              i=$((i+1))
            done
          fi
          if [ ! -f shorts_result.txt ] && [ ! -f shorts_uploaded.json ]; then
            bash pipeline/notify_telegram.sh "❌ Fallo la generacion de Shorts."
          fi
