name: Solo MINIATURA (sin tocar el SEO)

# Genera y fija la miniatura del ULTIMO video SIN cambiar titulo/descripcion/tags.
# Usa el thumbnail_text del paquete SEO que YA existe. No re-sube ni re-escribe SEO.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUCKET: video-forge
  PROJECT: "0001-youtube-money"

jobs:
  thumb:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: ffmpeg + fuentes
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-liberation

      - name: Bajar paquete SEO + video_id + guion (de R2)
        run: |
          npx --yes wrangler@4 r2 object get "$BUCKET/video/$PROJECT/package.json" --file=package.json --remote || echo "{}" > package.json
          npx --yes wrangler@4 r2 object get "$BUCKET/video/$PROJECT/video_id.txt" --file=video_id.txt --remote
          npx --yes wrangler@4 r2 object get "$BUCKET/audio/$PROJECT/voicemap_full.json" --file=voicemap_active.json --remote 2>/dev/null || cp "projects/$PROJECT/voicemap_full.json" voicemap_active.json
          echo "VIDEO_ID=$(cat video_id.txt)"

      - name: Generar + fijar la miniatura (SEO intacto)
        run: |
          TOPIC=$(node -e 'try{process.stdout.write(JSON.parse(require("fs").readFileSync("voicemap_active.json","utf8")).title||"data")}catch(e){process.stdout.write("data")}')
          TT=$(node -e 'try{process.stdout.write(JSON.parse(require("fs").readFileSync("package.json","utf8")).thumbnail_text||"THE DATA LENS")}catch(e){process.stdout.write("THE DATA LENS")}')
          echo "Tema: $TOPIC | Texto: $TT"
          node pipeline/make_thumbnail.mjs "$TOPIC" "$TT" thumbnail.jpg
          node pipeline/youtube_thumbnail.mjs "$(cat video_id.txt)" thumbnail.jpg || echo "miniatura no fijada"
          npx --yes wrangler@4 r2 object put "$BUCKET/video/$PROJECT/thumbnail.jpg" --file=thumbnail.jpg --remote --content-type image/jpeg || true

      - name: Avisar al chat
        if: always()
        run: |
          if [ -f thumbnail.jpg ]; then
            bash pipeline/notify_telegram.sh "🖼️ Miniatura actualizada en el video (el título/descripción/tags NO se tocaron)." thumbnail.jpg
          else
            bash pipeline/notify_telegram.sh "❌ No se pudo generar la miniatura."
          fi
