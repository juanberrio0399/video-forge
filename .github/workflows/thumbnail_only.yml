name: Miniatura (generar / aprobar) sin tocar el SEO

# mode=generate (default): crea la miniatura y la guarda para VERLA en la app. NO la fija.
# mode=apply: toma la miniatura ya generada y la FIJA en el video (tras tu aprobacion).
# Nunca toca titulo/descripcion/tags.

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "ID del video (vacio = el ultimo)"
        required: false
        default: ""
      mode:
        description: "generate | apply"
        required: false
        default: "generate"

permissions:
  contents: read

env:
  BUCKET: video-forge
  PROJECT: "0001-youtube-money"

jobs:
  thumb:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
      IN_VID: ${{ github.event.inputs.video_id }}
      MODE: ${{ github.event.inputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: ffmpeg + fuentes
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-liberation

      - name: Determinar video, tema y texto
        run: |
          npx --yes wrangler@4 r2 object get "$BUCKET/channel/videos.json" --file=videos.json --remote 2>/dev/null || echo '{}' > videos.json
          if [ -n "$IN_VID" ]; then
            VID="$IN_VID"; TITLE=$(node pipeline/yt_title.mjs "$VID"); TOPIC="$TITLE"; TT=$(node pipeline/thumb_text.mjs "$TITLE"); SAVE_SLOT="no"
          else
            npx --yes wrangler@4 r2 object get "$BUCKET/video/$PROJECT/package.json" --file=package.json --remote || echo "{}" > package.json
            npx --yes wrangler@4 r2 object get "$BUCKET/video/$PROJECT/video_id.txt" --file=video_id.txt --remote
            npx --yes wrangler@4 r2 object get "$BUCKET/audio/$PROJECT/voicemap_full.json" --file=voicemap_active.json --remote 2>/dev/null || cp "projects/$PROJECT/voicemap_full.json" voicemap_active.json
            VID=$(cat video_id.txt)
            TITLE=$(node -e 'try{process.stdout.write(JSON.parse(require("fs").readFileSync("voicemap_active.json","utf8")).title||"")}catch(e){}')
            TOPIC="$TITLE"; TT=$(node -e 'try{process.stdout.write(JSON.parse(require("fs").readFileSync("package.json","utf8")).thumbnail_text||"THE DATA LENS")}catch(e){process.stdout.write("THE DATA LENS")}'); SAVE_SLOT="yes"
          fi
          { echo "VID=$VID"; echo "TOPIC=$TOPIC"; echo "TT=$TT"; echo "TITLE=$TITLE"; echo "SAVE_SLOT=$SAVE_SLOT"; } >> "$GITHUB_ENV"
          echo "video=$VID | modo=${MODE:-generate} | texto=$TT"

      - name: GENERAR la miniatura (no la fija)
        if: ${{ github.event.inputs.mode != 'apply' }}
        run: |
          node pipeline/make_thumbnail.mjs "$TOPIC" "$TT" thumbnail.jpg
          npx --yes wrangler@4 r2 object put "$BUCKET/video/$PROJECT/thumb_${VID}.jpg" --file=thumbnail.jpg --remote --content-type image/jpeg
          if [ "$SAVE_SLOT" = "yes" ]; then npx --yes wrangler@4 r2 object put "$BUCKET/video/$PROJECT/thumbnail.jpg" --file=thumbnail.jpg --remote --content-type image/jpeg || true; fi
          # Marcar como GENERADA pero NO aplicada (para que salga el botón Aprobar en la app).
          node -e 'const fs=require("fs");let d={};try{d=JSON.parse(fs.readFileSync("videos.json","utf8"))}catch(e){};const v=process.env.VID;d[v]=d[v]||{stages:{}};d[v].stages=d[v].stages||{};d[v].stages.thumbnail=false;d[v].stages.thumb_approved=false;fs.writeFileSync("videos.json",JSON.stringify(d,null,2));'
          npx --yes wrangler@4 r2 object put "$BUCKET/channel/videos.json" --file=videos.json --remote --content-type application/json
          bash pipeline/notify_telegram.sh "🖼️ Miniatura GENERADA (aún no está puesta). Míralas en la app → Control y dale ✅ Aprobar, o 🔁 Rehacer." thumbnail.jpg

      - name: APLICAR la miniatura ya generada (fijar en YouTube)
        if: ${{ github.event.inputs.mode == 'apply' }}
        run: |
          npx --yes wrangler@4 r2 object get "$BUCKET/video/$PROJECT/thumb_${VID}.jpg" --file=thumbnail.jpg --remote || { echo "no hay miniatura generada"; exit 1; }
          node pipeline/youtube_thumbnail.mjs "$VID" thumbnail.jpg || echo "no fijada"
          node pipeline/mark_stage.mjs videos.json "$VID" "$TITLE" thumbnail
          npx --yes wrangler@4 r2 object put "$BUCKET/channel/videos.json" --file=videos.json --remote --content-type application/json
          bash pipeline/notify_telegram.sh "✅ Miniatura PUESTA en el video (SEO intacto)." thumbnail.jpg
