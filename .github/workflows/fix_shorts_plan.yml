name: Corregir plan de shorts (apuntar a los publicos)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BUCKET: video-forge
      KEY: shorts/0001-youtube-money/plan.json
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Bajar plan de R2
        run: npx --yes wrangler@4 r2 object get "$BUCKET/$KEY" --file=plan.json --remote
      - name: Corregir video_ids a los publicos
        run: node pipeline/fix_shorts_plan.mjs plan.json
      - name: Subir plan corregido a R2
        run: npx --yes wrangler@4 r2 object put "$BUCKET/$KEY" --file=plan.json --remote --content-type application/json
      - name: Avisar
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
        run: bash pipeline/notify_telegram.sh "✅ Plan de shorts corregido: ahora apunta a los 3 shorts PÚBLICOS reales. Abre la app → Shorts y ya deben salir 🟢 públicos con sus vistas."
