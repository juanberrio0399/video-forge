name: Repostear a Bilibili (Oddly) — Fase 2

# Cada mediodía repostea a Bilibili los Shorts de Oddly que quedaron en la cola (los encola space_short.yml).
# Sube con Playwright EN LA NUBE (no depende del PC). Detecta éxito/fallo por video y avisa a Telegram.
# Al éxito BORRA el MP4 de R2 (ya está en YouTube + Bilibili → no llena R2). Al fallo, lo deja para reintentar.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "30 17 * * *"   # 12:30 Bogotá (mediodía)

permissions:
  contents: read

env:
  BUCKET: video-forge

jobs:
  repost:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BILIBILI_COOKIE: ${{ secrets.BILIBILI_COOKIE }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Verificar cookie
        run: if [ -z "$BILIBILI_COOKIE" ]; then echo "❌ Falta BILIBILI_COOKIE"; exit 1; fi
      - name: Bajar cola + posteados (de R2)
        run: |
          npx --yes wrangler@4 r2 object get "$BUCKET/channel/oddly/bilibili_queue.json" --file=bilibili_queue.json --remote 2>/dev/null || echo '[]' > bilibili_queue.json
          npx --yes wrangler@4 r2 object get "$BUCKET/channel/oddly/bilibili_posted.json" --file=bilibili_posted.json --remote 2>/dev/null || echo '[]' > bilibili_posted.json
      - name: Instalar Playwright (Chromium)
        run: |
          npm i -D playwright@1.48.0
          npx playwright install --with-deps chromium
      - name: Repostear la cola a Bilibili
        run: node pipeline/bilibili_repost.mjs
      - name: Guardar cola + posteados actualizados (a R2)
        if: always()
        run: |
          if [ -f bilibili_queue_new.json ]; then npx --yes wrangler@4 r2 object put "$BUCKET/channel/oddly/bilibili_queue.json" --file=bilibili_queue_new.json --content-type application/json --remote; fi
          if [ -f bilibili_posted_new.json ]; then npx --yes wrangler@4 r2 object put "$BUCKET/channel/oddly/bilibili_posted.json" --file=bilibili_posted_new.json --content-type application/json --remote; fi
      - name: Guardar evidencia (capturas) del último intento
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bilibili-repost-evidence
          path: |
            shots/
            result.txt
          retention-days: 5
          if-no-files-found: ignore
