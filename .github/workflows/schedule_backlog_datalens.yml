name: Programar backlog de Data Lens (privados -> mejor hora)

# Auto-sanador de The Data Lens (YT_): descubre los videos PRIVADOS SIN programar (que en la app
# salen como "por aprobar") y los agenda a la mejor hora libre -> se publican solos. Respeta los
# OCULTOS (channel/hidden_videos.json), asi el backlog viejo de narrado muerto NUNCA se toca.
# Gemelo de schedule_backlog_oddly.yml. Cierra el hueco: Data Lens no tenia sanador y los privados
# fallidos quedaban como "por aprobar" para siempre.
on:
  schedule:
    - cron: "23 */6 * * *"   # cada 6h (desfasado del de Oddly): si a un video le fallo la programacion, lo agenda solo
  workflow_dispatch: {}

permissions:
  contents: read

env:
  BUCKET: video-forge

jobs:
  sched:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Descubrir privados + programar cada uno
        run: |
          npx --yes wrangler@4 r2 object get "$BUCKET/channel/best_hours.json" --file=best_hours.json --remote 2>/dev/null || echo '{}' > best_hours.json
          IDS=$(node pipeline/list_private.mjs "channel/hidden_videos.json")
          echo "IDs: $IDS"
          OCC=$(node pipeline/scheduled_times.mjs)
          N=0
          for VID in $(echo "$IDS" | tr ', ' '\n\n' | grep -v '^$'); do
            SLOT=$(node pipeline/best_slot.mjs "$OCC")
            rm -f schedule_result.txt
            node pipeline/youtube_schedule.mjs "$VID" "$SLOT" || true
            if grep -q "PROGRAMADO" schedule_result.txt 2>/dev/null; then echo "OK $VID -> $SLOT"; OCC="$OCC,$SLOT"; N=$((N+1)); else echo "skip $VID"; fi
          done
          echo "programados: $N"
          # Rompe el cache de inventario para que la app refresque el conteo "por aprobar" YA (no en 10 min).
          if [ "$N" -gt 0 ]; then npx --yes wrangler@4 r2 object delete "$BUCKET/channel/inventory_cache.json" --remote 2>/dev/null || true; fi
          bash pipeline/notify_telegram.sh "📅 Backlog de Data Lens: programe $N videos privados a sus mejores horas (se publican solos)." || true
