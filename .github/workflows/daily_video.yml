name: Video diario automatico (cron)

# ROBUSTEZ / AUTONOMIA por INACTIVIDAD: revisa cada 6h y produce SOLO si hace +18h que no hay
# video nuevo (lo suba Juan a mano o la fabrica) Y hay menos de 3 pendientes por aprobar.
# Asi: si Juan no produce en 18h, la fabrica saca uno; en ~2 dias ya hay un par LISTOS para
# aprobar; nunca produce 'a lo loco'. Juan siempre aprueba (los videos quedan PRIVADOS).
# Corre en la nube de GitHub -> no depende de Telegram ni de ninguna sesion abierta.

on:
  schedule:
    - cron: "0 */6 * * *"  # cada 6h: revisa inactividad. Produce SOLO si hace +18h que no hay video
                           #   (manual o auto) Y hay menos de 3 pendientes por aprobar -> nunca 'a lo loco'.
  workflow_dispatch: {}

permissions:
  contents: read

env:
  BUCKET: video-forge

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Producir el proximo video (con guardas)
        run: |
          # GUARDA 1 (INACTIVIDAD): solo trabaja si hace +18h que NO hay video (manual o auto) Y hay
          # menos de 3 pendientes por aprobar. Asi: si Juan no produce en 18h, la fabrica saca uno; en
          # 2 dias ya hay un par LISTOS para aprobar; nunca produce 'a lo loco'. Juan sigue aprobando.
          npx --yes wrangler@4 r2 object get "$BUCKET/channel/hidden_videos.json" --file=hidden.json --remote 2>/dev/null || echo '[]' > hidden.json
          IP=$(node pipeline/idle_check.mjs); IDLE=$(printf '%s' "$IP" | cut -d' ' -f1); PEND=$(printf '%s' "$IP" | cut -d' ' -f2)
          echo "Inactividad: ${IDLE}h desde el ultimo video · pendientes por aprobar: ${PEND}"
          CAP=3
          if [ "${PEND:-0}" -ge "$CAP" ]; then
            echo "Ya hay ${PEND} videos listos para aprobar (tope ${CAP}) -> no acumulo mas."
            exit 0
          fi
          if [ "${IDLE:-999}" -lt 18 ]; then
            echo "Hace ${IDLE}h que hubo un video (<18h) -> aun no hace falta; espero."
            exit 0
          fi
          # GUARDA 2: ¿hay una produccion o render en curso? -> no encimar.
          RUNNING=$(curl -s -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=30" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);const n=(j.workflow_runs||[]).filter(r=>r.status!=='completed'&&/Producir|Voiceover|Render VIDEO/i.test(r.name||'')).length;console.log(n)}catch(e){console.log(0)}})")
          if [ "${RUNNING:-0}" -gt 0 ]; then echo "Ya hay produccion/render en curso ($RUNNING) -> no encimo."; exit 0; fi
          # Elegir el proximo tema de la cola (no producido y por delante de los publicos).
          npx --yes wrangler@4 r2 object get "$BUCKET/channel/state.json" --file=state.json --remote 2>/dev/null || cp channel/seed.json state.json
          npx --yes wrangler@4 r2 object get "$BUCKET/channel/produced.json" --file=produced.json --remote 2>/dev/null || echo '{"done":[]}' > produced.json
          # Con command substitution + cut (robusto bajo bash -e; el 'read < <()' fallaba por EOF sin salto).
          SEL=$(node -e '
            const s=JSON.parse(require("fs").readFileSync("state.json","utf8"));
            const p=JSON.parse(require("fs").readFileSync("produced.json","utf8"));
            const done=new Set(p.done||[]);
            const pub=(s.published||[]).filter(v=>v.privacy==="public").length;
            const up=(s.upcoming||[]).filter(u=>!done.has(u.n)&&u.n>pub).sort((a,b)=>a.n-b.n);
            const next=up[0];
            if(next) process.stdout.write(next.n+"\t"+(next.topic||"").replace(/[\t\n]/g," "));
          ')
          N=$(printf '%s' "$SEL" | cut -f1)
          TOPIC=$(printf '%s' "$SEL" | cut -f2-)
          if [ -z "$SEL" ] || [ -z "$TOPIC" ]; then echo "Cola vacia -> nada que producir."; bash pipeline/notify_telegram.sh "⚠️ Video diario: la cola de ideas esta vacia. Genero mas en el proximo reporte." || true; exit 0; fi
          echo "Produciendo automatico: #$N - $TOPIC"
          # Con REINTENTOS: si el API de GitHub tiene un blip, no perdemos el video del dia.
          DISP=0
          for i in 1 2 3 4; do
            if gh workflow run produce_video.yml -f topic="$TOPIC" -f n="$N" -R "$GITHUB_REPOSITORY"; then DISP=1; break; fi
            echo "no pude disparar produce_video (intento $i); reintento"; sleep 12
          done
          if [ "$DISP" = "1" ]; then
            bash pipeline/notify_telegram.sh "🏭 Video diario AUTOMATICO arrancado: #$N - $TOPIC. Sale solo; te aviso cuando este en Control para aprobar." || true
          else
            bash pipeline/notify_telegram.sh "⚠️ No pude arrancar el video diario #$N (4 intentos al API de GitHub). Lo reintento en el próximo ciclo." || true
          fi
