name: Deploy radar-bot (Cloudflare)

# Despliega el Worker del RADAR-BOT (control del radar por Telegram) a Cloudflare, carga sus
# secretos y registra el webhook. Requiere estos GitHub Secrets:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, RADAR_BOT_TOKEN (bot nuevo de BotFather),
#   GH_TOKEN, OWNER_CHAT_ID, TELEGRAM_WEBHOOK_SECRET

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: radar-bot
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Desplegar Worker
        run: |
          for i in 1 2 3; do
            npx --yes wrangler@4 deploy | tee deploy.log && break
            echo "deploy reintento $i (hipo de Cloudflare)"; sleep 12
          done
          grep -qE 'https://[a-zA-Z0-9._-]+\.workers\.dev' deploy.log

      - name: Cargar secretos del Worker
        env:
          S_TELEGRAM_BOT_TOKEN: ${{ secrets.RADAR_BOT_TOKEN }}
          S_GH_TOKEN: ${{ secrets.GH_TOKEN }}
          S_OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
          S_TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          put(){ for i in 1 2 3; do printf '%s' "$2" | npx --yes wrangler@4 secret put "$1" && return 0; echo "reintento $1 ($i)"; sleep 10; done; echo "no pude poner $1"; return 1; }
          put TELEGRAM_BOT_TOKEN "$S_TELEGRAM_BOT_TOKEN"
          put GH_TOKEN "$S_GH_TOKEN"
          put OWNER_CHAT_ID "$S_OWNER_CHAT_ID"
          put TELEGRAM_WEBHOOK_SECRET "$S_TELEGRAM_WEBHOOK_SECRET"

      - name: Registrar webhook de Telegram
        run: |
          URL=$(grep -oE 'https://[a-zA-Z0-9._-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$URL" ]; then echo "No pude leer la URL del Worker"; exit 1; fi
          echo "Worker URL: $URL"
          RESP=$(curl -s "https://api.telegram.org/bot${{ secrets.RADAR_BOT_TOKEN }}/setWebhook" \
            --data-urlencode "url=${URL}/webhook" \
            --data-urlencode "secret_token=${{ secrets.TELEGRAM_WEBHOOK_SECRET }}")
          echo "Telegram: $RESP"
          echo "$RESP" | grep -q '"ok":true' || { echo "setWebhook falló"; exit 1; }
          echo "✅ radar-bot desplegado y webhook activo en $URL/webhook"
