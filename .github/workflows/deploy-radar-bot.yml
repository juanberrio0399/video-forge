name: Deploy radar-bot (Cloudflare)

# Despliega el Worker del RADAR-BOT (control del radar por Telegram) a Cloudflare, carga sus
# secretos y registra el webhook. Requiere estos GitHub Secrets:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID. El bot de Radar se borró (2026-09-14): Radar vive dentro del
#   bot único del AI OS (Video Forge), que sirve su panel por el canal interno OSGateway.
#   GH_TOKEN, OWNER_CHAT_ID, TELEGRAM_WEBHOOK_SECRET

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: radar-bot
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Desplegar Worker
        run: |
          for i in 1 2 3; do
            npx --yes wrangler@4 deploy --var APP_BUILD:"${GITHUB_SHA::7}" | tee deploy.log && break
            echo "deploy reintento $i (hipo de Cloudflare)"; sleep 12
          done
          grep -qE 'https://[a-zA-Z0-9._-]+\.workers\.dev' deploy.log

      - name: Cargar secretos del Worker
        env:
          S_GH_TOKEN: ${{ secrets.GH_TOKEN }}
          S_OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
          S_TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          put(){ for i in 1 2 3; do printf '%s' "$2" | npx --yes wrangler@4 secret put "$1" && return 0; echo "reintento $1 ($i)"; sleep 10; done; echo "no pude poner $1"; return 1; }
          put GH_TOKEN "$S_GH_TOKEN"
          put OWNER_CHAT_ID "$S_OWNER_CHAT_ID"
          put TELEGRAM_WEBHOOK_SECRET "$S_TELEGRAM_WEBHOOK_SECRET"
      # Sin webhook ni menú: el bot de Radar ya no existe; se usa desde el bot único (/p/radar).
