name: Programar backlog de Oddly (privados -> mejor hora)

# Descubre los videos PRIVADOS sin programar de Oddly (YT2) y los agenda a la mejor hora libre.
# One-shot: se dispara a mano cuando hay que limpiar el backlog.
on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  BUCKET: video-forge

jobs:
  sched:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      YT_CLIENT_ID: ${{ secrets.YT2_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT2_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT2_REFRESH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Descubrir privados + programar cada uno
        run: |
          npx --yes wrangler@4 r2 object get "$BUCKET/channel/auto2/best_hours.json" --file=best_hours.json --remote 2>/dev/null || echo '{}' > best_hours.json
          IDS=$(node pipeline/list_private.mjs "channel/auto2/hidden_videos.json")
          echo "IDs: $IDS"
          OCC=$(node pipeline/scheduled_times.mjs)
          N=0
          for VID in $(echo "$IDS" | tr ', ' '\n\n' | grep -v '^$'); do
            SLOT=$(node pipeline/best_slot.mjs "$OCC")
            rm -f schedule_result.txt
            node pipeline/youtube_schedule.mjs "$VID" "$SLOT" || true
            if grep -q "PROGRAMADO" schedule_result.txt 2>/dev/null; then echo "OK $VID -> $SLOT"; OCC="$OCC,$SLOT"; N=$((N+1)); else echo "skip $VID"; fi
          done
          echo "programados: $N"
          bash pipeline/notify_telegram.sh "📅 Backlog de Oddly: programé $N videos privados a sus mejores horas (se publican solos)." || true
